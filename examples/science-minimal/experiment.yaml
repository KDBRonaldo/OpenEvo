version: 1
experiment:
  name: biology-components
agent:
  preset: codex
  model: gpt-5.1-codex-mini
  auth: subscription
  settings:
    capture_mode: transcript
runtime:
  image: my-task-image:latest
evolution:
  rounds: 3
  targets:
    text_memory:
      enabled: true
      method: text_memory_reflector
      config: {}
    skill_bundle:
      enabled: true
      method: skill_bundle_reflector
      config: {}
    agent_system:
      enabled: true
      method: auto
      config:
        target_path: AGENTS.md
    parametric_memory:
      enabled: false
      method: parametric_memory_register
      config: {}
  # Keep disabled for the smallest local smoke test. Use mode: human or mode: llm
  # to require review before evolved artifacts enter later rollouts.
  promotion_gate:
    mode: none
    # For mode: human, auto uses a terminal prompt when available and otherwise
    # falls back to decision files under promotion_reviews/.
    human_input: auto
tasks:
  - id: component-extraction-train
    instruction: >
      Extract biological components from the provided article set. Produce one
      final file that lists the canonical article id for each extracted component.
    workspace: /root/codex54minitest/five_article_agentic_workflow_subset
