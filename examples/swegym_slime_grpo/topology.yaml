rollout:
  host: 127.0.0.1
  port: 8080
  public_url: http://127.0.0.1:8080
  save_dir: ./rollout_results

gateway:
  heartbeat_interval_seconds: 30
  nodes:
    - id: localhost-node-01
      host: 127.0.0.1
      port: 8100
      public_url: http://127.0.0.1:8100
      max_init_workers: 16
      max_run_workers: 16
      max_postrun_workers: 16
      model_served: Qwen/Qwen3.5-4B
      sglang:
        # run.sh/launch_e2e.sh render this to the host-reachable router URL.
        base_url: http://127.0.0.1:9000
