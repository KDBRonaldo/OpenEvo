# Polar bridge configuration for Slime's --custom-config-path.
# These become attributes on the `args` namespace passed to the rollout function.

polar_rollout_url: "http://127.0.0.1:8080"
polar_gateway_url: "http://127.0.0.1:8100"
polar_reward_key: "score"
polar_max_async_level: 2
polar_request_timeout: 2400
polar_callback_host: "127.0.0.1"
polar_min_complete_accept_fraction: 0.6
polar_allow_weight_update_overlap: false
polar_weight_update_pause_timeout: 300
# run.sh/launch_e2e.sh render this to an absolute host path before launch.
polar_agent_cli_dir: "tmp/swegym_agent_cli/opt_node"
polar_apptainer_image_dir: "tmp/swegym_apptainer_images"

# Task template rendered per sample group.  Placeholders are filled
# from the context: {instruction}, {num_samples}, {sample.*}, {args.*}.
polar_task_template:
  timeout_seconds: 2400
  runtime:
    backend: "apptainer"
    # Use project-local SIF files prepared from the official SWE-Gym registry
    # images.
    image: "{args.polar_apptainer_image_dir}/{sample.metadata.instance_id}.sif"
    network: "host"
    workdir: "/polar/session/workspace"
    env:
      HOME: "/polar/session/home"
      PATH: "/polar/session/home/.venv/bin:/opt/node/bin:/opt/miniconda3/envs/testbed/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    kwargs:
      volumes:
        - "{args.polar_agent_cli_dir}:/opt/node:ro"
    # Node 22 + agent CLIs are mounted from polar_agent_cli_dir — no npm install
    # at session start.
    prepare:
      - type: exec
        command: >-
          rm -rf /polar/session/workspace &&
          mkdir -p /polar/session/logs/agent /polar/session/workspace "$HOME/.venv/bin" &&
          cp -a /testbed/. /polar/session/workspace/ &&
          ln -sf /opt/miniconda3/envs/testbed/bin/python "$HOME/.venv/bin/python" &&
          ln -sf /opt/miniconda3/envs/testbed/bin/python "$HOME/.venv/bin/python3" &&
          git config --global core.pager '' &&
          cd /polar/session/workspace &&
          (git reset --hard || true)
    # Fresh reward-test runtime applies the patch and runs swebench tests.
    eval_prepare:
      - type: exec
        command: >-
          mkdir -p /polar/session/logs/agent "$HOME/.venv/bin" &&
          ln -sf /opt/miniconda3/envs/testbed/bin/python "$HOME/.venv/bin/python" &&
          ln -sf /opt/miniconda3/envs/testbed/bin/python "$HOME/.venv/bin/python3" &&
          git config --global core.pager ''
  agent:
    harness: "qwen_code"
    model_name: "gpt-5.4"
  builder:
    strategy: "prefix_merging"
  evaluator:
    strategy: "swebench_harness"
    refresh_runtime: true
    config:
      repo_dir: "/testbed"
      patch_command: "cd /polar/session/workspace && git add -A && git diff --cached --binary"
      instance: "{sample.metadata.instance}"
      # Strip per-harness config/session dirs and common stray artifacts that
      # would otherwise get swept into `git add -A` and bloat the patch.
      exclude_patterns:
        - "trajectories/**"
        - "**/trajectories/**"
        - "node_modules/**"
        - "**/node_modules/**"
        - ".cache/**"
        - "**/.cache/**"
        - ".venv/**"
        - "**/.venv/**"
        - ".claude/**"
        - "**/.claude/**"
        - ".codex/**"
        - "**/.codex/**"
        - ".gemini/**"
        - "**/.gemini/**"
        - ".opencode/**"
        - "**/.opencode/**"
        - ".config/opencode/**"
        - ".pi/**"
        - "**/.pi/**"
        - ".qwen/**"
        - "**/.qwen/**"
        # Guard against the historical claude_code $HOME-literal env bug
        # (now fixed, but old workspaces may still carry these dirs).
        - "$HOME/**"
        - "**/$HOME/**"

polar_task_id_template: "polar-swegym-grpo-{rollout_id}-{sample.group_index}"
