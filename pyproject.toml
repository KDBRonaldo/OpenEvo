[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openevo"
version = "0.1.5"
description = "OpenEvo Desktop and agent evolution orchestration."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "OpenEvo contributors" },
]

dependencies = [
    "fastapi>=0.115.0",
    "click>=8.3.3",
    "idna>=3.15",
    "starlette>=1.3.1",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/CompLifeLab-ZJU/OpenEvo"
Repository = "https://github.com/CompLifeLab-ZJU/OpenEvo"
Issues = "https://github.com/CompLifeLab-ZJU/OpenEvo/issues"

[project.optional-dependencies]
swebench = [
    "swebench",
    "datasets",
]

[project.scripts]
openevo-backend = "openevo.backend.launcher:main"
openevo-core-service = "openevo.backend.service:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "build>=1.2.0",
    "packaging>=24.0",
    "setuptools>=68",
    "wheel",
    "pyinstaller>=6.11,<7",
    "pip-audit==2.9.0",
    "twine>=5.0.0",
]

[tool.uv]
torch-backend = "auto"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["openevo*", "slime_bridge*"]

[tool.setuptools.package-data]
openevo = [
    "wheels/*.whl",
]
slime_bridge = ["README.md"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src", "."]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".venv",
    "build",
    "dist",
    "examples",
    "logs",
    "train-logs",
    "tmp",
    "rollout_results",
    "slime",
    "Megatron-LM",
]
markers = [
    "unit: fast CPU-only checks",
    "integration: checks that need local services or external programs",
    "gpu: checks that need GPU-backed model serving",
]

[tool.ruff]
line-length = 99
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "slime",
    "Megatron-LM",
    "logs",
    "train-logs",
    "tmp",
    "rollout_results",
]
