[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openevo"
version = "0.1.10"
description = "OpenEvo self-hosted WebUI and agent evolution runtime."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "OpenEvo contributors" },
]

dependencies = [
    "fastapi>=0.115.0",
    "filelock>=3.25.2",
    "click>=8.3.3",
    "idna>=3.15",
    "starlette>=1.3.1",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pypdf>=6.0,<7",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
]

[project.scripts]
openevo-daemon = "openevo.daemon.cli:main"

[project.urls]
Homepage = "https://github.com/CompLifeLab-ZJU/OpenEvo"
Repository = "https://github.com/CompLifeLab-ZJU/OpenEvo"
Issues = "https://github.com/CompLifeLab-ZJU/OpenEvo/issues"

[project.optional-dependencies]
swebench = [
    "swebench",
    "datasets",
]
parametric-memory = [
    "accelerate>=1.0,<2",
    "bitsandbytes>=0.44,<1; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "peft>=0.13,<1",
    "safetensors>=0.4,<1",
    "torch>=2.4,<3",
    "transformers>=4.45,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "build>=1.2.0",
    "packaging>=24.0",
    "setuptools>=68",
    "wheel",
    "pyinstaller>=6.11,<7",
    "pip-audit==2.9.0",
    "twine>=5.0.0",
]

[tool.uv]
torch-backend = "auto"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["openevo*", "slime_bridge*"]

[tool.setuptools.package-data]
openevo = [
    "web_gateway/static/*.html",
    "web_gateway/static/assets/*",
    "wheels/*.whl",
]
slime_bridge = ["README.md"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src", "."]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".venv",
    "build",
    "dist",
    "examples",
    "logs",
    "train-logs",
    "tmp",
    "rollout_results",
    "slime",
    "Megatron-LM",
]
markers = [
    "unit: fast CPU-only checks",
    "integration: checks that need local services or external programs",
    "gpu: checks that need GPU-backed model serving",
    "legacy_rsync: legacy explicit-transport checks that require local /usr/bin/rsync",
]

[tool.ruff]
line-length = 99
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "slime",
    "Megatron-LM",
    "logs",
    "train-logs",
    "tmp",
    "rollout_results",
]
