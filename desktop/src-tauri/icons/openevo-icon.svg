<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">OpenEvo application icon</title>
  <desc id="desc">A continuous two-color spiral on a rounded square.</desc>

  <!-- The 64-unit clear edge keeps the macOS silhouette away from the canvas boundary. -->
  <rect x="64" y="72" width="896" height="896" rx="216" fill="#132A24"/>
  <rect x="88" y="88" width="848" height="848" rx="192" fill="#F4F7F5"/>

  <!-- One continuous gesture: the outer cycle folds inward into its next state. -->
  <path
    d="M 716 326
       C 626 239, 488 218, 374 272
       C 260 326, 198 445, 220 565
       C 242 688, 342 780, 466 793
       C 590 806, 710 738, 758 625
       C 786 560, 784 488, 758 426"
    fill="none"
    stroke="#173E35"
    stroke-width="116"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 758 426
       C 723 347, 642 306, 559 320
       C 463 336, 394 419, 398 516
       C 402 610, 480 684, 576 680
       C 636 678, 690 645, 719 594"
    fill="none"
    stroke="#F06449"
    stroke-width="116"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
