[package]
name = "openevo-desktop"
version = "0.1.8"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hmac = "0.12"
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
