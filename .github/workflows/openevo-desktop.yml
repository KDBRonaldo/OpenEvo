name: OpenEvo Desktop checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/openevo-desktop.yml"
      - "desktop/**"
      - "scripts/ci/smoke_openevo_desktop_bundle.py"
      - "scripts/ci/smoke_openevo_desktop_sidecar.py"
      - "scripts/ci/write_sha256.py"
      - "tests/ci/test_check_openevo_release.py"

jobs:
  desktop-tests:
    name: desktop frontend and tauri checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - name: Check OpenEvo Desktop frontend
        working-directory: desktop
        run: |
          npm ci
          npm audit --audit-level=high
          npm test -- --run
          npm run build:openevo

      - name: Check OpenEvo Desktop Tauri host
        working-directory: desktop/src-tauri
        run: |
          cargo metadata --locked --format-version 1
          cargo test --locked
