name: OpenEvo packaged sidecar and Desktop source checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/openevo-desktop.yml"
      - ".github/workflows/openevo-desktop-candidate.yml"
      - ".github/workflows/openevo-python.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "desktop/**"
      - "src/openevo/deployment/**"
      - "scripts/ci/build_openevo_daemon_bundle.py"
      - "scripts/ci/openevo_desktop_daemon_resource.py"
      - "scripts/ci/openevo_release_candidate.py"
      - "scripts/ci/smoke_openevo_desktop_bundle.py"
      - "scripts/ci/smoke_openevo_desktop_sidecar.py"
      - "scripts/ci/write_sha256.py"
      - "tests/ci/test_build_sidecar.py"
      - "tests/ci/test_build_openevo_daemon_bundle.py"
      - "tests/ci/test_check_openevo_release.py"
      - "tests/ci/test_openevo_desktop_daemon_resource.py"
      - "tests/ci/test_openevo_release_candidate.py"
      - "tests/ci/test_openevo_python_workflow.py"
      - "tests/ci/test_sidecar_startup_diagnostics.py"
      - "tests/openevo/remote/**"
      - "tests/openevo/sidecar/test_fd_xattrs.py"
      - "tests/openevo/sidecar/test_native_workspace.py"
      - "tests/openevo/sidecar/test_workspace_import_lifecycle.py"
      - "tests/openevo/sidecar/test_workspace_imports.py"

jobs:
  desktop-tests:
    name: desktop frontend and tauri checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"

      - name: Install packaged sidecar build dependencies
        run: |
          uv sync --frozen --group dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Test packaged sidecar builder
        run: |
          uv run python -m pytest \
            tests/ci/test_build_sidecar.py \
            tests/ci/test_build_openevo_daemon_bundle.py \
            tests/ci/test_openevo_desktop_daemon_resource.py \
            tests/ci/test_openevo_release_candidate.py \
            tests/ci/test_check_openevo_release.py \
            -q

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - name: Check OpenEvo Desktop frontend
        working-directory: desktop
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm audit --audit-level=high
          npm test -- --run
          npm run test:product-browser
          npm run typecheck
          npm run build:openevo

      - name: Build packaged OpenEvo Desktop sidecar
        working-directory: desktop
        run: |
          npm run build:sidecar
          sidecar="$GITHUB_WORKSPACE/desktop/src-tauri/binaries/openevo-desktop-sidecar-$(rustc --print host-tuple)"
          test -x "$sidecar"
          echo "OPENEVO_PACKAGED_SIDECAR_PATH=$sidecar" >> "$GITHUB_ENV"

      - name: Exercise packaged fixed-executable birth dispatch
        run: |
          uv run python -m pytest \
            tests/openevo/remote/test_system_executables.py::test_packaged_sidecar_dispatches_owned_subprocess_birth_to_held_executable \
            -q

      - name: Check OpenEvo Desktop Tauri host
        working-directory: desktop/src-tauri
        run: |
          cargo metadata --locked --format-version 1
          cargo fmt --check
          cargo check --locked --all-targets
          cargo check --locked --release --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --release --all-targets -- -D warnings
          cargo test --locked
          cargo test --locked --release
          cargo test --locked tests::packaged_external_bin_native_launch_smoke -- --ignored --exact
          cargo build --locked --release
          if strings target/release/openevo-desktop | grep -Fq 'desktop.server.launcher'; then
            echo 'release binary contains the debug source launcher fallback' >&2
            exit 1
          fi
          if strings target/release/openevo-desktop | grep -Fq 'Debug sidecar arguments require'; then
            echo 'release binary contains debug sidecar override code' >&2
            exit 1
          fi

      - name: Remove generated sidecar inventory
        if: always()
        run: |
          if [ -n "${OPENEVO_PACKAGED_SIDECAR_PATH:-}" ]; then
            rm -f "$OPENEVO_PACKAGED_SIDECAR_PATH"
          fi
          rm -rf desktop/packaging/sidecar-build desktop/packaging/sidecar-dist

  macos-native-launch-smoke:
    name: macOS FD-bound packaged sidecar launch smoke
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"

      - name: Install build dependencies
        run: |
          uv sync --frozen --group dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Exercise macOS APFS workspace ingest and store lifecycle
        run: |
          umask 077
          uv run python -m pytest --basetemp="$RUNNER_TEMP/oe-workspace" \
            tests/openevo/sidecar/test_fd_xattrs.py \
            tests/openevo/sidecar/test_native_workspace.py \
            tests/openevo/sidecar/test_provider_store.py::test_sqlite_connection_accepts_an_inode_identical_ancestor_alias \
            tests/openevo/sidecar/test_provider_store.py::test_standard_sqlite_rollback_journal_recovers_a_crashed_transaction \
            tests/openevo/sidecar/test_core_bridge_store_v1.py::test_darwin_sqlite_connection_uses_managed_path_and_persists_writes \
            tests/openevo/sidecar/test_core_bridge_store_v1.py::test_sqlite_connection_accepts_an_inode_identical_ancestor_alias \
            tests/openevo/sidecar/test_core_bridge_store_v1.py::test_open_store_rejects_database_pathname_replacement \
            tests/openevo/sidecar/test_core_bridge_store_v1.py::test_fresh_initial_schema_hot_journal_rolls_back_then_bootstraps \
            tests/openevo/sidecar/test_workspace_imports.py \
            tests/openevo/sidecar/test_workspace_import_lifecycle.py \
            -q

      - name: Exercise macOS fixed SSH executable and process authority
        run: |
          unset SSH_AUTH_SOCK
          umask 077
          case "${HOME:-}" in
            /*) ;;
            *) echo "HOME must be an absolute path" >&2; exit 1 ;;
          esac
          ssh_test_prefix="$HOME/.oe-ssh."
          ssh_test_root="$(mktemp -d "${ssh_test_prefix}XXXXXX")"
          case "$ssh_test_root" in
            "$ssh_test_prefix"??????) ;;
            *) echo "Unexpected SSH test root" >&2; exit 1 ;;
          esac
          trap 'rm -rf -- "$ssh_test_root"' EXIT
          chmod 700 "$ssh_test_root"
          uv run python -m pytest --basetemp="$ssh_test_root/pytest" \
            tests/openevo/remote/test_system_executables.py \
            tests/openevo/remote/test_host_keys.py \
            tests/openevo/remote/test_ssh_transport.py \
            -q

      - name: Exercise macOS Core release publication contract
        run: |
          uv run python -m pytest \
            tests/ci/test_build_sidecar.py \
            -q

      - name: Build frontend and FD-aware PyInstaller externalBin
        working-directory: desktop
        run: |
          npm ci
          npm run build:openevo
          npm run build:sidecar
          sidecar="$GITHUB_WORKSPACE/desktop/src-tauri/binaries/openevo-desktop-sidecar-$(rustc --print host-tuple)"
          test -x "$sidecar"
          echo "OPENEVO_PACKAGED_SIDECAR_PATH=$sidecar" >> "$GITHUB_ENV"

      - name: Exercise macOS private executable and FD handoff lifecycle
        working-directory: desktop/src-tauri
        run: |
          cargo test --locked --release -- --test-threads=1
          cargo test --locked tests::macos_release_spawns_from_the_populated_private_path -- --exact
          cargo test --locked tests::packaged_external_bin_native_launch_smoke -- --ignored --exact

      - name: Exercise packaged fixed-executable birth dispatch
        run: |
          uv run python -m pytest \
            tests/openevo/remote/test_system_executables.py::test_packaged_sidecar_dispatches_owned_subprocess_birth_to_held_executable \
            -q

      - name: Remove generated sidecar inventory
        if: always()
        run: |
          if [ -n "${OPENEVO_PACKAGED_SIDECAR_PATH:-}" ]; then
            rm -f "$OPENEVO_PACKAGED_SIDECAR_PATH"
          fi
          rm -rf desktop/packaging/sidecar-build desktop/packaging/sidecar-dist
