name: OpenEvo release artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  wheel-artifact:
    name: build validated wheel artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build OpenEvo Desktop assets
        working-directory: desktop
        run: |
          npm ci
          npm audit --audit-level=high
          npm test -- --run
          npm run build:openevo

      - name: Check packaged Desktop assets are current
        run: |
          diff -qr desktop/dist desktop/packaging/web

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test release validator
        run: |
          python -m pip install --upgrade pip pytest -e .
          PYTHONPATH=src:. python -m pytest tests/ci/test_check_openevo_release.py tests/ci/test_openevo_productization_identity.py -q
          PYTHONPATH=src:. python scripts/ci/audit_openevo_identity.py

      - name: Build remote install wheel
        run: |
          python -m pip install build
          rm -rf .openevo-remote-wheel src/openevo/wheels
          python -m build --wheel --outdir .openevo-remote-wheel
          mkdir -p src/openevo/wheels
          cp .openevo-remote-wheel/openevo-*.whl src/openevo/wheels/

      - name: Build wheel
        run: |
          rm -rf dist
          python -m build --wheel

      - name: Validate OpenEvo wheel
        run: |
          python scripts/ci/check_openevo_release.py --wheel dist/*.whl

      - name: Write OpenEvo wheel checksum
        run: |
          python scripts/ci/write_sha256.py dist/*.whl

      - name: Install wheel and smoke OpenEvo Backend
        run: |
          python -m venv .openevo-wheel-smoke
          .openevo-wheel-smoke/bin/python -m pip install --upgrade pip
          .openevo-wheel-smoke/bin/python -m pip install dist/*.whl
          .openevo-wheel-smoke/bin/openevo-backend --help
          .openevo-wheel-smoke/bin/openevo-backend serve --help
          .openevo-wheel-smoke/bin/openevo-backend run --help
          PYTHONPATH=. .openevo-wheel-smoke/bin/python scripts/ci/smoke_openevo_desktop_wheel.py

      - name: Upload OpenEvo wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: openevo-wheel
          path: |
            dist/*.whl
            dist/*.whl.sha256
          if-no-files-found: error

  desktop-dmg-artifact:
    name: build macOS desktop dmg artifact
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install OpenEvo Desktop sidecar build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Check Tauri Rust lockfile
        working-directory: desktop/src-tauri
        run: |
          cargo metadata --locked --format-version 1
          cargo test --locked

      - name: Build OpenEvo Desktop dmg
        working-directory: desktop
        run: |
          npm ci
          npm run build:desktop

      - name: Smoke OpenEvo Desktop app bundle sidecar
        run: |
          python scripts/ci/smoke_openevo_desktop_bundle.py \
            desktop/src-tauri/target/release/bundle/macos

      - name: Write OpenEvo Desktop dmg checksum
        working-directory: desktop
        run: |
          python ../scripts/ci/write_sha256.py src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload OpenEvo Desktop dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: openevo-desktop-dmg
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/dmg/*.dmg.sha256
          if-no-files-found: error

  release-notes-artifact:
    name: write release notes artifact
    runs-on: ubuntu-latest
    steps:
      - name: Write release notes
        run: |
          mkdir -p .openevo-release-notes
          printf '# OpenEvo %s release artifacts\n\n' "${GITHUB_REF_NAME}" > .openevo-release-notes/release-notes.md
          printf 'This release contains the OpenEvo Core Backend wheel and the OpenEvo Desktop macOS disk image.\n' >> .openevo-release-notes/release-notes.md

      - name: Upload OpenEvo release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: openevo-release-notes
          path: .openevo-release-notes/release-notes.md
          if-no-files-found: error

  release-artifact-list:
    name: validate release artifact list
    runs-on: ubuntu-latest
    needs:
      - wheel-artifact
      - desktop-dmg-artifact
      - release-notes-artifact
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Validate OpenEvo release artifact list
        run: |
          python scripts/ci/check_openevo_release.py \
            --wheel release-artifacts/openevo-wheel/*.whl \
            --artifact \
              release-artifacts/openevo-wheel/* \
              release-artifacts/openevo-desktop-dmg/* \
              release-artifacts/openevo-release-notes/release-notes.md
