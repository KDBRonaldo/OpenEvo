name: OpenEvo release artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  wheel-artifact:
    name: build validated wheel artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build OpenEvo Desktop assets
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
          npm test -- --run
          npm run build:openevo

      - name: Check packaged Desktop assets are current
        run: |
          diff -qr web/dist desktop/packaging/web

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test release validator
        run: |
          python -m pip install --upgrade pip pytest -e .
          PYTHONPATH=src:. python -m pytest tests/ci/test_check_openevo_release.py -q

      - name: Build remote install wheel
        run: |
          python -m pip install build
          rm -rf .openevo-remote-wheel src/openevo/wheels
          python -m build --wheel --outdir .openevo-remote-wheel
          mkdir -p src/openevo/wheels
          cp .openevo-remote-wheel/openevo-*.whl src/openevo/wheels/

      - name: Build wheel
        run: |
          rm -rf dist
          python -m build --wheel

      - name: Validate OpenEvo wheel
        run: |
          python scripts/ci/check_openevo_release.py --wheel dist/*.whl

      - name: Install wheel and smoke OpenEvo Backend
        run: |
          python -m venv .openevo-wheel-smoke
          .openevo-wheel-smoke/bin/python -m pip install --upgrade pip
          .openevo-wheel-smoke/bin/python -m pip install dist/*.whl
          .openevo-wheel-smoke/bin/openevo-backend --help
          .openevo-wheel-smoke/bin/openevo-backend serve --help
          .openevo-wheel-smoke/bin/openevo-backend run --help
          PYTHONPATH=. .openevo-wheel-smoke/bin/python scripts/ci/smoke_openevo_desktop_wheel.py

      - name: Upload OpenEvo wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: openevo-wheel
          path: dist/*.whl
          if-no-files-found: error

  desktop-dmg-artifact:
    name: build macOS desktop dmg artifact
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Check Tauri Rust lockfile
        working-directory: web/src-tauri
        run: |
          cargo metadata --locked --format-version 1

      - name: Build OpenEvo Desktop dmg
        working-directory: web
        run: |
          npm ci
          npm run build:desktop

      - name: Upload OpenEvo Desktop dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: openevo-desktop-dmg
          path: web/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release-artifact-list:
    name: validate release artifact list
    runs-on: ubuntu-latest
    needs:
      - wheel-artifact
      - desktop-dmg-artifact
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Validate OpenEvo release artifact list
        run: |
          python scripts/ci/check_openevo_release.py \
            --wheel release-artifacts/openevo-wheel/*.whl \
            --artifact release-artifacts/openevo-wheel/*.whl release-artifacts/openevo-desktop-dmg/*.dmg
