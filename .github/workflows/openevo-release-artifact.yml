name: OpenEvo release artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    name: pre-external-beta release artifact path disabled
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled release artifact path
        run: |
          cat <<'EOF'
          This pre-External-Beta release artifact workflow is disabled.
          It must not build release-looking wheel, DMG, or release-note artifacts
          outside the External Beta gates. The replacement workflow must build,
          test, checksum, upload, redownload, and verify the exact Core and DMG
          bytes required by docs/maintainer/productization/spec.md.
          EOF
