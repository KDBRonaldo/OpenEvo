name: Publish OpenEvo to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish validated wheel to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openevo/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build OpenEvo Desktop assets
        working-directory: desktop
        run: |
          npm ci
          npm audit --audit-level=high
          npm test -- --run
          npm run build:openevo

      - name: Check packaged Desktop assets are current
        run: |
          diff -qr desktop/dist desktop/packaging/web

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test release validator
        run: |
          python -m pip install --upgrade pip pytest twine -e .
          PYTHONPATH=src:. python -m pytest tests/ci/test_check_openevo_release.py tests/ci/test_openevo_productization_identity.py -q
          PYTHONPATH=src:. python scripts/ci/audit_openevo_identity.py

      - name: Build remote install wheel
        run: |
          python -m pip install build
          rm -rf .openevo-remote-wheel src/openevo/wheels
          python -m build --wheel --outdir .openevo-remote-wheel
          mkdir -p src/openevo/wheels
          cp .openevo-remote-wheel/openevo-*.whl src/openevo/wheels/

      - name: Build wheel
        run: |
          rm -rf dist
          python -m build --wheel

      - name: Validate OpenEvo wheel
        run: |
          python scripts/ci/check_openevo_release.py --wheel dist/*.whl
          rm -rf .openevo-publish-checks
          mkdir -p .openevo-publish-checks
          cp dist/*.whl .openevo-publish-checks/
          python scripts/ci/write_sha256.py .openevo-publish-checks/*.whl
          twine check --strict dist/*.whl

      - name: Install wheel and smoke OpenEvo Backend
        run: |
          python -m venv .openevo-wheel-smoke
          .openevo-wheel-smoke/bin/python -m pip install --upgrade pip
          .openevo-wheel-smoke/bin/python -m pip install dist/*.whl
          .openevo-wheel-smoke/bin/openevo-backend --help
          .openevo-wheel-smoke/bin/openevo-backend serve --help
          .openevo-wheel-smoke/bin/openevo-backend run --help
          PYTHONPATH=. .openevo-wheel-smoke/bin/python scripts/ci/smoke_openevo_desktop_wheel.py

      - name: Publish OpenEvo wheel to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
