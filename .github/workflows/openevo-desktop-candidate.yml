name: OpenEvo Desktop unsigned draft prerelease

on:
  workflow_dispatch:
    inputs:
      candidate_label:
        description: Short label used in the draft prerelease tag
        required: false
        default: exhibition

permissions:
  contents: read

concurrency:
  group: openevo-desktop-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-daemon-bundle:
    name: Build frozen Linux x86_64 Daemon bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Require the reviewed stable source on Linux x86_64
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$GITHUB_REF" = "refs/heads/stable"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Gate non-release simulator preview
        working-directory: desktop
        run: |
          npm ci
          npx playwright install --with-deps chromium
          CI=1 npm run test:product-browser:preview
          CI=1 npm run test:product-browser:release-live -- --list

      - name: Produce packaged release-composition Playwright report
        working-directory: desktop
        run: |
          blob_dir="$RUNNER_TEMP/openevo-release-playwright-blobs"
          mkdir -m 700 "$blob_dir"
          CI=1 PLAYWRIGHT_BLOB_OUTPUT_FILE="$blob_dir/release-packaged.zip" \
            npm run test:product-browser:release-readonly -- --reporter=blob
          PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/playwright-raw-report.json" \
            npx playwright merge-reports --reporter=json "$blob_dir"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.29"

      - name: Install frozen Daemon build dependencies
        run: uv sync --frozen --group dev

      - name: Create closed candidate Playwright evidence
        run: |
          evidence_dir="$RUNNER_TEMP/openevo-desktop-playwright"
          mkdir -m 700 "$evidence_dir"
          cp desktop/packaging/web/.openevo-product-web.json \
            "$evidence_dir/packaged-web-manifest.json"
          browser_version="$(cd desktop && node -e \
            'const { chromium } = require("@playwright/test"); (async () => { const browser = await chromium.launch({ headless: true }); console.log(await browser.version()); await browser.close(); })().catch(error => { console.error(error); process.exit(1); });')"
          uv run python scripts/ci/openevo_release_candidate.py write-playwright-evidence \
            "$evidence_dir/playwright-candidate-evidence.json" \
            --raw-report "$RUNNER_TEMP/playwright-raw-report.json" \
            --sanitized-report-output "$evidence_dir/playwright-report.json" \
            --packaged-web-manifest "$evidence_dir/packaged-web-manifest.json" \
            --source-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --browser-version "$browser_version"
          uv run python scripts/ci/openevo_release_candidate.py validate-playwright-evidence \
            "$evidence_dir/playwright-candidate-evidence.json" \
            --report "$evidence_dir/playwright-report.json" \
            --packaged-web-manifest "$evidence_dir/packaged-web-manifest.json" \
            --expected-source-commit "$GITHUB_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload immutable candidate Playwright evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openevo-desktop-playwright-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openevo-desktop-playwright
          if-no-files-found: error
          retention-days: 14

      - name: Test Daemon bundle and Desktop resource contracts
        run: |
          uv run python -m pytest \
            tests/ci/test_build_openevo_daemon_bundle.py \
            tests/ci/test_openevo_desktop_daemon_resource.py \
            tests/openevo/test_core_host_service.py \
            -q

      - name: Build exact Core inputs and self-contained Daemon
        run: |
          uv run python scripts/ci/openevo_desktop_daemon_resource.py build \
            --output-dir "$RUNNER_TEMP/openevo-desktop-daemon-inputs" \
            --source-commit "$GITHUB_SHA"
          test "$(find "$RUNNER_TEMP/openevo-desktop-daemon-inputs/core" -maxdepth 1 -type f -name 'openevo-*.whl' | wc -l | tr -d ' ')" = 1
          test -f "$RUNNER_TEMP/openevo-desktop-daemon-inputs/core/framework-lock.json"
          test -x "$RUNNER_TEMP/openevo-desktop-daemon-inputs/daemon/openevo-daemon-linux-x86_64"
          test -f "$RUNNER_TEMP/openevo-desktop-daemon-inputs/daemon/openevo-daemon-bundle.json"
          test -f "$RUNNER_TEMP/openevo-desktop-daemon-inputs/daemon/SHA256SUMS"

      - name: Upload immutable Daemon composition inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openevo-desktop-daemon-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openevo-desktop-daemon-inputs
          if-no-files-found: error
          retention-days: 14

  macos-candidate:
    name: Build and smoke unsigned macOS candidate
    runs-on: macos-14
    timeout-minutes: 150
    needs: linux-daemon-bundle
    outputs:
      manifest_sha256: ${{ steps.candidate.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Require a reviewed stable commit and safe label
        env:
          CANDIDATE_LABEL: ${{ inputs.candidate_label }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$GITHUB_REF" = "refs/heads/stable"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          if [[ ! "$CANDIDATE_LABEL" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$ ]]; then
            echo "candidate_label must be a short filename-safe identifier" >&2
            exit 1
          fi
          git check-ref-format \
            "refs/tags/openevo-desktop-v0-${CANDIDATE_LABEL}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # 3.11.15 is unavailable on the arm64 macOS runner. The Linux
          # Daemon and Core jobs retain their frozen 3.11.15 toolchain.
          python-version: "3.11.9"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.29"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action, resolved 2026-07-18
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Install locked build dependencies
        run: |
          uv sync --frozen --group dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Download exact Linux Daemon composition inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openevo-desktop-daemon-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openevo-desktop-daemon-inputs

      - name: Download exact candidate Playwright evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openevo-desktop-playwright-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openevo-desktop-playwright

      - name: Revalidate candidate Playwright evidence on macOS
        run: |
          evidence_dir="$RUNNER_TEMP/openevo-desktop-playwright"
          test "$(find "$evidence_dir" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3
          test -z "$(find "$evidence_dir" -type l -print -quit)"
          chmod 0600 "$evidence_dir"/*.json
          uv run python scripts/ci/openevo_release_candidate.py validate-playwright-evidence \
            "$evidence_dir/playwright-candidate-evidence.json" \
            --report "$evidence_dir/playwright-report.json" \
            --packaged-web-manifest "$evidence_dir/packaged-web-manifest.json" \
            --expected-source-commit "$GITHUB_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Restore and constrain Daemon composition input modes
        run: |
          daemon_inputs="$RUNNER_TEMP/openevo-desktop-daemon-inputs"
          test "$(find "$daemon_inputs/core" -maxdepth 1 -type f -name 'openevo-*.whl' | wc -l | tr -d ' ')" = 1
          test "$(find "$daemon_inputs" -type f | wc -l | tr -d ' ')" = 5
          test -z "$(find "$daemon_inputs" -type l -print -quit)"
          chmod 0600 \
            "$daemon_inputs"/core/openevo-*.whl \
            "$daemon_inputs/core/framework-lock.json" \
            "$daemon_inputs/daemon/openevo-daemon-bundle.json" \
            "$daemon_inputs/daemon/SHA256SUMS"
          chmod 0700 "$daemon_inputs/daemon/openevo-daemon-linux-x86_64"
          echo "OPENEVO_DAEMON_INPUTS=$daemon_inputs" >> "$GITHUB_ENV"

      - name: Test packaging and candidate contracts
        run: |
          uv run python -m pytest \
            tests/ci/test_build_sidecar.py \
            tests/ci/test_openevo_desktop_daemon_resource.py \
            tests/ci/test_check_openevo_release.py \
            tests/ci/test_openevo_release_candidate.py \
            tests/ci/test_openevo_release_evidence.py \
            tests/ci/test_desktop_real_science_e2e.py \
            tests/ci/test_validate_desktop_real_science_e2e.py \
            tests/ci/test_desktop_system_ssh_integration.py \
            tests/openevo/sidecar/test_provider_store.py::test_sqlite_connection_accepts_an_inode_identical_ancestor_alias \
            tests/openevo/sidecar/test_provider_store.py::test_standard_sqlite_rollback_journal_recovers_a_crashed_transaction \
            tests/openevo/sidecar/test_core_bridge_store_v1.py::test_darwin_sqlite_connection_uses_managed_path_and_persists_writes \
            tests/openevo/sidecar/test_core_bridge_store_v1.py::test_sqlite_connection_accepts_an_inode_identical_ancestor_alias \
            tests/openevo/sidecar/test_core_bridge_store_v1.py::test_open_store_rejects_database_pathname_replacement \
            tests/openevo/sidecar/test_core_bridge_store_v1.py::test_fresh_initial_schema_hot_journal_rolls_back_then_bootstraps \
            -q
          uv run python scripts/ci/audit_openevo_identity.py

      - name: Gate real macOS system OpenSSH workflows and fixed authority
        run: |
          unset SSH_AUTH_SOCK
          umask 077
          case "${HOME:-}" in
            /*) ;;
            *) echo "HOME must be an absolute path" >&2; exit 1 ;;
          esac
          ssh_test_prefix="$HOME/.oe-ssh."
          ssh_test_root="$(mktemp -d "${ssh_test_prefix}XXXXXX")"
          case "$ssh_test_root" in
            "$ssh_test_prefix"??????) ;;
            *) echo "Unexpected SSH test root" >&2; exit 1 ;;
          esac
          trap 'rm -rf -- "$ssh_test_root"' EXIT
          chmod 700 "$ssh_test_root"
          uv run python -m pytest --basetemp="$ssh_test_root/pytest" \
            tests/openevo/remote/test_system_executables.py \
            tests/openevo/remote/test_host_keys.py \
            tests/openevo/remote/test_system_host_keys.py \
            tests/openevo/remote/test_system_openssh_alias.py \
            tests/openevo/remote/test_ssh_transport.py \
            tests/openevo/sidecar/test_askpass_broker.py \
            tests/openevo/sidecar/test_system_ssh_session.py \
            -q
          uv run python scripts/ci/run_desktop_system_ssh_integration.py \
            --require-complete \
            --evidence-out "$ssh_test_root/desktop-system-ssh-integration.json"

      - name: Resolve exact product version and runner architecture
        run: |
          version_output="$RUNNER_TEMP/openevo-product-version"
          uv run python - > "$version_output" <<'PY'
          import json
          import re
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          with (root / "pyproject.toml").open("rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          core_init = (root / "src/openevo/__init__.py").read_text(encoding="utf-8")
          core_match = re.search(
              r'^__version__\s*=\s*["\']([^"\']+)["\']$',
              core_init,
              re.MULTILINE,
          )
          if core_match is None:
              raise SystemExit("Core package version is unavailable")
          renderer = json.loads((root / "desktop/package.json").read_text(encoding="utf-8"))["version"]
          with (root / "desktop/src-tauri/Cargo.toml").open("rb") as stream:
              native = tomllib.load(stream)["package"]["version"]
          tauri = json.loads(
              (root / "desktop/src-tauri/tauri.conf.json").read_text(encoding="utf-8")
          )["version"]
          if {core_match.group(1), renderer, native, tauri} != {version}:
              raise SystemExit("Core, renderer, native host, and Tauri versions do not match")
          print(version)
          PY
          IFS= read -r version < "$version_output"
          rm -f -- "$version_output"
          test -n "$version"
          triple="$(rustc --print host-tuple)"
          case "$triple" in
            aarch64-apple-darwin) architecture="aarch64" ;;
            x86_64-apple-darwin) architecture="x64" ;;
            *) echo "Unsupported macOS runner target: $triple" >&2; exit 1 ;;
          esac
          echo "OPENEVO_VERSION=$version" >> "$GITHUB_ENV"
          echo "OPENEVO_RUST_TARGET=$triple" >> "$GITHUB_ENV"
          echo "OPENEVO_ARCHITECTURE=$architecture" >> "$GITHUB_ENV"

      - name: Download and verify controlled managed subscription runtime asset
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RELEASE_ID: "356072935"
          RUNTIME_ASSET_ID: "481361975"
          RUNTIME_ASSET_NAME: openevo-science-runtime-0.1.1-linux-amd64.tar.gz
          RUNTIME_ASSET_SIZE: "352236726"
          RUNTIME_ASSET_SHA256: ad9c5ebd69b5785b94dd52dc077d93ababfa9cf8cbcbf92940f60bee48a91149
        run: |
          runtime_dir="$RUNNER_TEMP/openevo-managed-runtime"
          mkdir -m 700 "$runtime_dir"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RUNTIME_RELEASE_ID" \
            > "$runtime_dir/release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$RUNTIME_ASSET_ID" \
            > "$runtime_dir/asset.json"
          runtime_archive="$runtime_dir/$RUNTIME_ASSET_NAME"
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$RUNTIME_ASSET_ID" \
            > "$runtime_archive"
          test "$(stat -f '%z' "$runtime_archive")" = "$RUNTIME_ASSET_SIZE"
          printf '%s  %s\n' "$RUNTIME_ASSET_SHA256" "$runtime_archive" \
            | shasum -a 256 --check -
          chmod 600 "$runtime_archive"
          uv run python scripts/ci/verify_managed_runtime_release_asset.py \
            "$runtime_dir/release.json" \
            "$runtime_dir/asset.json" \
            "$runtime_archive" \
            --evidence-out "$runtime_dir/managed-runtime-source.json"
          echo "OPENEVO_MANAGED_RUNTIME_ARCHIVE=$runtime_archive" >> "$GITHUB_ENV"
          echo "OPENEVO_MANAGED_RUNTIME_SOURCE=$runtime_dir/managed-runtime-source.json" \
            >> "$GITHUB_ENV"

      - name: Test and build renderer
        working-directory: desktop
        run: |
          npm ci
          npm test -- --run
          npm run typecheck
          npm run build:openevo

      - name: Audit shipped npm dependencies
        working-directory: desktop
        run: npm audit --audit-level=high --json > "$RUNNER_TEMP/npm-audit.json" || true

      - name: Audit shipped Python dependencies
        run: |
          mkdir candidate-artifacts
          uv export --frozen --no-dev --format requirements-txt \
            --no-annotate --no-header --no-emit-project \
            > candidate-artifacts/python-requirements.txt
          uv run pip-audit \
            --requirement candidate-artifacts/python-requirements.txt \
            --require-hashes \
            --format json > "$RUNNER_TEMP/pip-audit.json" || true

      - name: Audit shipped Rust dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit \
            --file desktop/src-tauri/Cargo.lock \
            --json > "$RUNNER_TEMP/cargo-audit.json" || true

      - name: Collect dependency, license, and security evidence
        run: |
          uv run python scripts/ci/collect_openevo_release_evidence.py \
            --repo "$GITHUB_WORKSPACE" \
            --output-dir candidate-artifacts \
            --npm-audit "$RUNNER_TEMP/npm-audit.json" \
            --pip-audit "$RUNNER_TEMP/pip-audit.json" \
            --pip-requirements candidate-artifacts/python-requirements.txt \
            --cargo-audit "$RUNNER_TEMP/cargo-audit.json"

      - name: Build packaged sidecar from the exact Core release
        working-directory: desktop
        run: |
          python packaging/build_sidecar.py \
            --core-wheel "$OPENEVO_DAEMON_INPUTS"/core/openevo-*.whl \
            --framework-lock "$OPENEVO_DAEMON_INPUTS/core/framework-lock.json" \
            --managed-runtime-archive "$OPENEVO_MANAGED_RUNTIME_ARCHIVE" \
            --daemon-bundle "$OPENEVO_DAEMON_INPUTS/daemon/openevo-daemon-linux-x86_64" \
            --daemon-manifest "$OPENEVO_DAEMON_INPUTS/daemon/openevo-daemon-bundle.json" \
            --release-build
          echo "OPENEVO_CANDIDATE_CORE=$OPENEVO_DAEMON_INPUTS/core" >> "$GITHUB_ENV"
          sidecar="$GITHUB_WORKSPACE/desktop/src-tauri/binaries/openevo-desktop-sidecar-${OPENEVO_RUST_TARGET}"
          askpass="$GITHUB_WORKSPACE/desktop/src-tauri/binaries/openevo-ssh-askpass-${OPENEVO_RUST_TARGET}"
          test -x "$sidecar"
          test -x "$askpass"
          echo "OPENEVO_PACKAGED_SIDECAR_PATH=$sidecar" >> "$GITHUB_ENV"

      - name: Clean-install and verify final Core wheel, lock, and registry
        run: |
          test "$(find "$OPENEVO_CANDIDATE_CORE" -maxdepth 1 -name 'openevo-*.whl' | wc -l | tr -d ' ')" = 1
          test -f "$OPENEVO_CANDIDATE_CORE/framework-lock.json"
          python -m venv "$RUNNER_TEMP/openevo-core-wheel-smoke"
          "$RUNNER_TEMP/openevo-core-wheel-smoke/bin/python" -m pip install \
            --require-hashes \
            --requirement candidate-artifacts/python-requirements.txt
          "$RUNNER_TEMP/openevo-core-wheel-smoke/bin/python" -m pip install \
            --no-deps "$OPENEVO_CANDIDATE_CORE"/openevo-*.whl
          PYTHONPATH= "$RUNNER_TEMP/openevo-core-wheel-smoke/bin/openevo-backend" --help
          PYTHONPATH= "$RUNNER_TEMP/openevo-core-wheel-smoke/bin/openevo-core-service" --help
          PYTHONPATH= "$RUNNER_TEMP/openevo-core-wheel-smoke/bin/python" \
            scripts/ci/smoke_evolution_framework_wheel.py \
            --wheel "$OPENEVO_CANDIDATE_CORE"/openevo-*.whl \
            --framework-lock "$OPENEVO_CANDIDATE_CORE/framework-lock.json" \
            --mode installed-registry \
            > "$RUNNER_TEMP/installed-registry-smoke.json"
          registry_digest="$(uv run python -c \
            'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["registry_digest"])' \
            "$RUNNER_TEMP/installed-registry-smoke.json")"
          test "${#registry_digest}" = 64
          echo "OPENEVO_REGISTRY_DIGEST=$registry_digest" >> "$GITHUB_ENV"

      - name: Verify and stage controlled Tauri release assets
        run: |
          uv run python scripts/ci/openevo_desktop_daemon_resource.py stage \
            --bundle "$OPENEVO_DAEMON_INPUTS/daemon/openevo-daemon-linux-x86_64" \
            --manifest "$OPENEVO_DAEMON_INPUTS/daemon/openevo-daemon-bundle.json" \
            --wheel "$OPENEVO_CANDIDATE_CORE"/openevo-*.whl \
            --framework-lock "$OPENEVO_CANDIDATE_CORE/framework-lock.json" \
            --managed-runtime-archive "$OPENEVO_MANAGED_RUNTIME_ARCHIVE" \
            --source-commit "$GITHUB_SHA" \
            --registry-digest "$OPENEVO_REGISTRY_DIGEST" \
            --output-dir desktop/src-tauri/release-resources/openevo-release-assets

      - name: Validate locked release-mode Tauri dependency graph
        working-directory: desktop/src-tauri
        timeout-minutes: 5
        run: |
          metadata="$RUNNER_TEMP/openevo-cargo-metadata.json"
          cargo metadata --locked --format-version 1 > "$metadata"
          python - "$metadata" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if not payload.get("packages") or not payload.get("workspace_members"):
              raise SystemExit("cargo metadata omitted packages or workspace members")
          PY

      - name: Check release-mode Tauri formatting
        working-directory: desktop/src-tauri
        timeout-minutes: 5
        run: cargo fmt --check

      - name: Compile release-mode Tauri host
        working-directory: desktop/src-tauri
        timeout-minutes: 30
        run: cargo check --locked --release --all-targets

      - name: Lint release-mode Tauri host
        working-directory: desktop/src-tauri
        timeout-minutes: 30
        run: cargo clippy --locked --release --all-targets -- -D warnings

      - name: Test release-mode Tauri host
        working-directory: desktop/src-tauri
        timeout-minutes: 45
        run: cargo test --locked --release -- --test-threads=1

      - name: Exercise packaged native sidecar launch
        working-directory: desktop/src-tauri
        timeout-minutes: 10
        run: cargo test --locked tests::packaged_external_bin_native_launch_smoke -- --ignored --exact

      - name: Build unsigned Desktop DMG for the runner architecture
        working-directory: desktop
        timeout-minutes: 30
        run: npm run tauri:build -- --ci --config src-tauri/tauri.release.conf.json

      - name: Require native binary inspection tools
        run: |
          file --version
          test -x "$(xcrun --find lipo)"

      - name: Copy exact candidate bytes
        run: |
          dmg_count="$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')"
          test "$dmg_count" = 1
          dmg_source="$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print)"
          cp "$dmg_source" \
            "candidate-artifacts/OpenEvo-Desktop-${OPENEVO_VERSION}-${OPENEVO_ARCHITECTURE}.dmg"
          cp "$OPENEVO_CANDIDATE_CORE"/openevo-*.whl candidate-artifacts/
          cp "$OPENEVO_CANDIDATE_CORE/framework-lock.json" candidate-artifacts/
          cp "$OPENEVO_DAEMON_INPUTS/daemon/openevo-daemon-linux-x86_64" \
            candidate-artifacts/
          cp "$OPENEVO_DAEMON_INPUTS/daemon/openevo-daemon-bundle.json" \
            candidate-artifacts/
          cp "$OPENEVO_MANAGED_RUNTIME_SOURCE" \
            candidate-artifacts/managed-runtime-source.json
          cmp "$RUNNER_TEMP/openevo-desktop-playwright/packaged-web-manifest.json" \
            desktop/packaging/web/.openevo-product-web.json
          cp "$RUNNER_TEMP/openevo-desktop-playwright/playwright-candidate-evidence.json" \
            candidate-artifacts/
          cp "$RUNNER_TEMP/openevo-desktop-playwright/playwright-report.json" \
            candidate-artifacts/
          cp "$RUNNER_TEMP/openevo-desktop-playwright/packaged-web-manifest.json" \
            candidate-artifacts/

      - name: Mount, launch, copy, detach, and relaunch the exact DMG app
        run: |
          mount_dir="$(mktemp -d)"
          copy_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet >/dev/null 2>&1 || true
            rm -rf "$mount_dir" "$copy_dir"
          }
          trap cleanup EXIT
          dmg="candidate-artifacts/OpenEvo-Desktop-${OPENEVO_VERSION}-${OPENEVO_ARCHITECTURE}.dmg"
          hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse -readonly
          mounted_app="$mount_dir/OpenEvo Desktop.app"
          copied_app="$copy_dir/OpenEvo Desktop.app"
          test -d "$mounted_app"
          mounted_sidecar="$mounted_app/Contents/MacOS/openevo-desktop-sidecar"
          test -x "$mounted_sidecar"
          codesign --verify --deep --strict --verbose=2 "$mounted_app"
          codesign -dv --verbose=4 "$mounted_app" \
            2> "$RUNNER_TEMP/openevo-candidate-codesign.txt"
          grep -F "Signature=adhoc" \
            "$RUNNER_TEMP/openevo-candidate-codesign.txt"
          # Verify unsigned Desktop code-signing policy before executing the mounted app.
          uv run python scripts/ci/verify_openevo_desktop_codesign.py \
            --app "$mounted_app" \
            --evidence-out "$RUNNER_TEMP/openevo-mounted-codesign.json"
          uv run python scripts/ci/openevo_desktop_daemon_resource.py verify-app \
            --app "$mounted_app" \
            --bundle "$OPENEVO_DAEMON_INPUTS/daemon/openevo-daemon-linux-x86_64" \
            --manifest "$OPENEVO_DAEMON_INPUTS/daemon/openevo-daemon-bundle.json" \
            --wheel "$OPENEVO_CANDIDATE_CORE"/openevo-*.whl \
            --framework-lock "$OPENEVO_CANDIDATE_CORE/framework-lock.json" \
            --managed-runtime-archive "$OPENEVO_MANAGED_RUNTIME_ARCHIVE" \
            --source-commit "$GITHUB_SHA" \
            --source-dmg "$dmg" \
            --launch-origin mounted_dmg \
            --evidence-out candidate-artifacts/daemon-mounted-resource.json
          uv run python scripts/ci/smoke_openevo_desktop_bundle.py \
            "$mounted_app" \
            --launch-origin mounted_dmg \
            --source-dmg "$dmg" \
            --timeout-seconds 120 \
            --evidence-out candidate-artifacts/app-bundle-smoke.json
          ditto "$mounted_app" "$copied_app"
          hdiutil detach "$mount_dir" -quiet
          quarantine_value="0081;$(printf '%x' "$(date +%s)");OpenEvoDesktopCI;"
          xattr -w com.apple.quarantine "$quarantine_value" "$copied_app"
          test "$(xattr -p com.apple.quarantine "$copied_app")" = "$quarantine_value"
          xattr -dr com.apple.quarantine "$copied_app"
          if xattr -p com.apple.quarantine "$copied_app" >/dev/null 2>&1; then
            echo "Documented quarantine removal did not clear the copied app" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$copied_app"
          uv run python scripts/ci/verify_openevo_desktop_codesign.py \
            --app "$copied_app" \
            --evidence-out "$RUNNER_TEMP/openevo-copied-codesign.json"
          cmp "$RUNNER_TEMP/openevo-mounted-codesign.json" \
            "$RUNNER_TEMP/openevo-copied-codesign.json"
          uv run python scripts/ci/openevo_desktop_daemon_resource.py verify-app \
            --app "$copied_app" \
            --bundle "$OPENEVO_DAEMON_INPUTS/daemon/openevo-daemon-linux-x86_64" \
            --manifest "$OPENEVO_DAEMON_INPUTS/daemon/openevo-daemon-bundle.json" \
            --wheel "$OPENEVO_CANDIDATE_CORE"/openevo-*.whl \
            --framework-lock "$OPENEVO_CANDIDATE_CORE/framework-lock.json" \
            --managed-runtime-archive "$OPENEVO_MANAGED_RUNTIME_ARCHIVE" \
            --source-commit "$GITHUB_SHA" \
            --source-dmg "$dmg" \
            --launch-origin detached_copy \
            --evidence-out candidate-artifacts/daemon-copy-resource.json
          uv run python scripts/ci/smoke_openevo_desktop_bundle.py \
            "$copied_app" \
            --launch-origin detached_copy \
            --source-dmg "$dmg" \
            --timeout-seconds 120 \
            --evidence-out candidate-artifacts/dmg-copy-smoke.json

          legacy_state="$HOME/.openevo/desktop/local-api-v1"
          current_root="$HOME/Library/Application Support/org.openevo.desktop"
          current_state="$current_root/state-v2"
          current_provider_state="$current_state/provider-v2"
          current_native_state="$current_root/native-state-v2"
          legacy_native_retry="$current_root/.7f3d8b24c1a94762"
          legacy_native_lock="$current_root/.c41d73e981bf4a56"
          test ! -e "$legacy_state"
          test ! -e "$current_state"
          test ! -e "$current_native_state"
          mkdir -p "$legacy_state"
          chmod 700 "$legacy_state"
          printf '%s\n' 'intentionally corrupt Preview database' \
            > "$legacy_state/provider.sqlite3"
          printf '%s\n' 'intentionally stale Preview lock' \
            > "$legacy_state/provider.lock"
          chmod 600 "$legacy_state/provider.sqlite3" "$legacy_state/provider.lock"
          cp "$legacy_state/provider.sqlite3" "$RUNNER_TEMP/legacy-provider.sqlite3"
          cp "$legacy_state/provider.lock" "$RUNNER_TEMP/legacy-provider.lock"
          legacy_directory_mode="$(stat -f '%Lp' "$legacy_state")"
          legacy_database_mode="$(stat -f '%Lp' "$legacy_state/provider.sqlite3")"
          legacy_lock_mode="$(stat -f '%Lp' "$legacy_state/provider.lock")"
          mkdir -p "$current_root"
          chmod 755 "$current_root"
          printf '%s\n' 'intentionally stale native Preview recovery state' \
            > "$legacy_native_retry"
          printf '%s\n' 'intentionally stale native Preview recovery lock' \
            > "$legacy_native_lock"
          chmod 600 "$legacy_native_retry" "$legacy_native_lock"
          cp "$legacy_native_retry" "$RUNNER_TEMP/legacy-native-retry"
          cp "$legacy_native_lock" "$RUNNER_TEMP/legacy-native-lock"
          current_root_mode="$(stat -f '%Lp' "$current_root")"
          legacy_native_mode="$(stat -f '%Lp' "$legacy_native_retry")"
          legacy_native_lock_mode="$(stat -f '%Lp' "$legacy_native_lock")"

          uv run python scripts/ci/smoke_openevo_desktop_bundle.py \
            "$copied_app" \
            --launch-origin detached_copy \
            --source-dmg "$dmg" \
            --timeout-seconds 120 \
            --existing-home "$HOME" \
            --evidence-out "$RUNNER_TEMP/legacy-state-app-bundle-smoke.json"

          xattr -w com.apple.quarantine "$quarantine_value" "$copied_app"
          test "$(xattr -p com.apple.quarantine "$copied_app")" = "$quarantine_value"
          uv run python scripts/ci/smoke_openevo_desktop_launchservices.py \
            "$copied_app" \
            --expected-version "$OPENEVO_VERSION" \
            --source-dmg "$dmg" \
            --timeout-seconds 120 \
            --evidence-out candidate-artifacts/launchservices-smoke.json

          test -f "$current_provider_state/provider-v2.sqlite3"
          test -f "$current_provider_state/provider-v2.lock"
          test ! -e "$current_state/provider.sqlite3"
          # The v2 renderer delegates mutation idempotency to the durable
          # sidecar/Core boundary and does not open the retained v1 native
          # retry journal merely by starting.
          test ! -e "$current_native_state"
          cmp "$legacy_state/provider.sqlite3" "$RUNNER_TEMP/legacy-provider.sqlite3"
          cmp "$legacy_state/provider.lock" "$RUNNER_TEMP/legacy-provider.lock"
          cmp "$legacy_native_retry" "$RUNNER_TEMP/legacy-native-retry"
          cmp "$legacy_native_lock" "$RUNNER_TEMP/legacy-native-lock"
          test "$(stat -f '%Lp' "$legacy_state")" = "$legacy_directory_mode"
          test "$(stat -f '%Lp' "$legacy_state/provider.sqlite3")" = "$legacy_database_mode"
          test "$(stat -f '%Lp' "$legacy_state/provider.lock")" = "$legacy_lock_mode"
          test "$(stat -f '%Lp' "$current_root")" = "$current_root_mode"
          test "$(stat -f '%Lp' "$legacy_native_retry")" = "$legacy_native_mode"
          test "$(stat -f '%Lp' "$legacy_native_lock")" = "$legacy_native_lock_mode"

      - name: Retain LaunchServices state-isolation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openevo-desktop-launchservices-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/legacy-state-app-bundle-smoke.json
            candidate-artifacts/launchservices-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Write release notes and authoritative candidate manifest
        id: candidate
        run: |
          uv run python scripts/ci/openevo_release_candidate.py write-notes \
            candidate-artifacts/release-notes.md \
            --source-commit "$GITHUB_SHA" \
            --version "$OPENEVO_VERSION" \
            --architecture "$OPENEVO_ARCHITECTURE"
          uv run python scripts/ci/openevo_release_candidate.py create \
            candidate-artifacts \
            --source-commit "$GITHUB_SHA" \
            --version "$OPENEVO_VERSION" \
            --architecture "$OPENEVO_ARCHITECTURE" \
            --rust-target "$OPENEVO_RUST_TARGET" \
            --registry-digest "$OPENEVO_REGISTRY_DIGEST"
          uv run python scripts/ci/openevo_release_candidate.py validate \
            candidate-artifacts/release-candidate.json \
            --expected-source-commit "$GITHUB_SHA" \
            --expected-core-platform linux-x86_64
          test -f candidate-artifacts/core-install-artifact.json
          test -f candidate-artifacts/SHA256SUMS
          manifest_sha256="$(shasum -a 256 candidate-artifacts/release-candidate.json | awk '{print $1}')"
          test "${#manifest_sha256}" = 64
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload exact candidate for cross-platform verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openevo-desktop-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload immutable publication verification inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openevo-desktop-publication-inputs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate-artifacts/release-candidate.json
            candidate-artifacts/app-bundle-smoke.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain failed supply-chain summaries
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openevo-desktop-candidate-failure-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate-artifacts/dependency-inventory.json
            candidate-artifacts/license-inventory.json
            candidate-artifacts/security-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove generated build inventory
        if: always()
        run: |
          if [ -n "${OPENEVO_PACKAGED_SIDECAR_PATH:-}" ]; then
            rm -f "$OPENEVO_PACKAGED_SIDECAR_PATH"
          fi
          rm -rf \
            .candidate-core \
            desktop/packaging/sidecar-build \
            desktop/packaging/sidecar-dist \
            desktop/src-tauri/release-resources

  linux-core-candidate:
    name: Verify exact candidate Core bytes on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: macos-candidate
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Require an ephemeral GitHub-hosted Core runner
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: test "$RUNNER_ENVIRONMENT" = "github-hosted"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.29"

      - name: Install locked smoke dependencies
        run: uv sync --frozen --group dev

      - name: Download exact final candidate bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openevo-desktop-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-artifacts

      - name: Restore private Core candidate input modes
        run: |
          chmod 0600 \
            candidate-artifacts/openevo-*.whl \
            candidate-artifacts/framework-lock.json \
            candidate-artifacts/python-requirements.txt
          chmod 0700 candidate-artifacts/openevo-daemon-linux-x86_64
          test "$(stat -c '%a' candidate-artifacts/framework-lock.json)" = 600

      - name: Verify candidate manifest and transferred manifest bytes
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.macos-candidate.outputs.manifest_sha256 }}
        run: |
          test "${#EXPECTED_MANIFEST_SHA256}" = 64
          printf '%s  %s\n' "$EXPECTED_MANIFEST_SHA256" candidate-artifacts/release-candidate.json \
            | sha256sum --check -
          uv run python scripts/ci/openevo_release_candidate.py validate \
            candidate-artifacts/release-candidate.json \
            --expected-source-commit "$GITHUB_SHA" \
            --expected-core-platform linux-x86_64
          candidate-artifacts/openevo-daemon-linux-x86_64 \
            smoke --deadline-seconds 60 > "$RUNNER_TEMP/candidate-daemon-smoke.json"

      - name: Redownload and bind the same managed subscription runtime source
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RELEASE_ID: "356072935"
          RUNTIME_ASSET_ID: "481361975"
          RUNTIME_ASSET_NAME: openevo-science-runtime-0.1.1-linux-amd64.tar.gz
          RUNTIME_ASSET_SIZE: "352236726"
          RUNTIME_ASSET_SHA256: ad9c5ebd69b5785b94dd52dc077d93ababfa9cf8cbcbf92940f60bee48a91149
        run: |
          runtime_dir="$RUNNER_TEMP/openevo-managed-runtime-linux"
          mkdir -m 700 "$runtime_dir"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RUNTIME_RELEASE_ID" \
            > "$runtime_dir/release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$RUNTIME_ASSET_ID" \
            > "$runtime_dir/asset.json"
          runtime_archive="$runtime_dir/$RUNTIME_ASSET_NAME"
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$RUNTIME_ASSET_ID" \
            > "$runtime_archive"
          test "$(stat -c '%s' "$runtime_archive")" = "$RUNTIME_ASSET_SIZE"
          printf '%s  %s\n' "$RUNTIME_ASSET_SHA256" "$runtime_archive" \
            | sha256sum --check -
          chmod 600 "$runtime_archive"
          uv run python scripts/ci/verify_managed_runtime_release_asset.py \
            "$runtime_dir/release.json" \
            "$runtime_dir/asset.json" \
            "$runtime_archive" \
            --evidence-out "$runtime_dir/managed-runtime-source.json"
          cmp candidate-artifacts/managed-runtime-source.json \
            "$runtime_dir/managed-runtime-source.json"
          echo "OPENEVO_LINUX_RUNTIME_ARCHIVE=$runtime_archive" >> "$GITHUB_ENV"

      - name: Smoke Linux migration and context projection from exact Core wheel
        run: |
          python -m venv "$RUNNER_TEMP/openevo-candidate-core"
          "$RUNNER_TEMP/openevo-candidate-core/bin/python" -m pip install \
            --require-hashes \
            --requirement candidate-artifacts/python-requirements.txt
          "$RUNNER_TEMP/openevo-candidate-core/bin/python" -m pip install \
            --no-deps candidate-artifacts/openevo-*.whl
          PYTHONPATH= "$RUNNER_TEMP/openevo-candidate-core/bin/openevo-backend" --help
          PYTHONPATH= "$RUNNER_TEMP/openevo-candidate-core/bin/openevo-core-service" --help
          PYTHONPATH= "$RUNNER_TEMP/openevo-candidate-core/bin/python" \
            scripts/ci/smoke_evolution_framework_wheel.py \
            --wheel candidate-artifacts/openevo-*.whl \
            --framework-lock candidate-artifacts/framework-lock.json \
            --mode linux-context-projection \
            > "$RUNNER_TEMP/linux-context-projection-smoke.json"
          uv run python - "$RUNNER_TEMP/linux-context-projection-smoke.json" \
            candidate-artifacts/release-candidate.json <<'PY'
          import json
          from pathlib import Path
          import sys

          smoke = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          candidate = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if smoke.get("verification_mode") != "linux-context-projection":
              raise SystemExit("Linux candidate did not run the context-projection smoke")
          if smoke.get("linux_context_projection") != "passed":
              raise SystemExit("Linux candidate context-projection evidence is incomplete")
          if smoke["registry_digest"] != candidate["core"]["registry_digest"]:
              raise SystemExit("Linux registry digest differs from the candidate manifest")
          PY

      - name: Exercise real Docker load identity rollback and subscription alias
        run: |
          set -euo pipefail
          daemon_name="openevo-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          socket_root="$RUNNER_TEMP/$daemon_name"
          test "$socket_root" = \
            "$RUNNER_TEMP/openevo-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$socket_root"
          cleanup() {
            docker --host unix:///var/run/docker.sock rm -f "$daemon_name" \
              >/dev/null 2>&1 || true
            sudo rm -rf -- "$socket_root"
          }
          trap cleanup EXIT
          docker --host unix:///var/run/docker.sock run -d --privileged \
            -e DOCKER_TLS_CERTDIR= \
            --name "$daemon_name" \
            --mount "type=bind,src=$socket_root,dst=/var/run" \
            docker:29.3-dind@sha256:a8d074fe486e65abe4ce251c264b78727be7b63a789ccb1eff2dcc786b443cb2 \
            --host=unix:///var/run/docker.sock --tls=false
          dind_socket="$socket_root/docker.sock"
          for attempt in $(seq 1 60); do
            if sudo docker --host "unix://$dind_socket" \
              version --format '{{.Server.Version}}' 2>/dev/null \
              | grep -q '^29\.3\.'; then
              break
            fi
            sleep 1
          done
          sudo docker --host "unix://$dind_socket" \
            version --format '{{.Server.Version}}' | grep -q '^29\.3\.'
          dind_socket_device="$(stat -Lc '%d' "$dind_socket")"
          dind_socket_inode="$(stat -Lc '%i' "$dind_socket")"
          [[ "$dind_socket_device" =~ ^[0-9]+$ ]]
          [[ "$dind_socket_inode" =~ ^[1-9][0-9]*$ ]]
          sudo env \
            OPENEVO_DIND_SOCKET="$dind_socket" \
            OPENEVO_DIND_SOCKET_DEVICE="$dind_socket_device" \
            OPENEVO_DIND_SOCKET_INODE="$dind_socket_inode" \
            OPENEVO_EVIDENCE="$GITHUB_WORKSPACE/managed-runtime-docker-evidence.json" \
            OPENEVO_REPO="$GITHUB_WORKSPACE" \
            OPENEVO_RUNTIME_ARCHIVE="$OPENEVO_LINUX_RUNTIME_ARCHIVE" \
            unshare --mount --propagation private -- \
            bash -ceu '
              mount --bind "$OPENEVO_DIND_SOCKET" /var/run/docker.sock
              export DOCKER_HOST=unix:///var/run/docker.sock
              smoke_root="$(mktemp -d /tmp/openevo-managed-runtime-smoke.XXXXXX)"
              trap '\''rm -rf -- "$smoke_root"'\'' EXIT
              chmod 700 "$smoke_root"
              smoke_archive="$smoke_root/$(basename "$OPENEVO_RUNTIME_ARCHIVE")"
              cp -- "$OPENEVO_RUNTIME_ARCHIVE" "$smoke_archive"
              chmod 600 "$smoke_archive"
              test "$(stat -c "%u:%a" "$smoke_archive")" = "0:600"
              cd "$OPENEVO_REPO"
              "$OPENEVO_REPO/.venv/bin/python" \
                scripts/ci/smoke_managed_runtime_archive.py \
                "$smoke_archive" \
                --fixed-docker-fault-injection \
                --expected-docker-socket-device "$OPENEVO_DIND_SOCKET_DEVICE" \
                --expected-docker-socket-inode "$OPENEVO_DIND_SOCKET_INODE" \
                --evidence-out "$OPENEVO_EVIDENCE"
            '

      - name: Retain real Docker managed runtime evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openevo-managed-runtime-docker-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: managed-runtime-docker-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Smoke exact candidate Core service lifecycle
        run: |
          set -euo pipefail
          attachment_suffix="$(PYTHONPATH= "$RUNNER_TEMP/openevo-candidate-core/bin/python" -c 'import secrets; print(secrets.token_hex(16))')"
          [[ "$attachment_suffix" =~ ^[0-9a-f]{32}$ ]] || {
            echo "candidate Core attachment suffix is invalid" >&2
            exit 1
          }
          attachment_name="bootstrap-${attachment_suffix}.json"
          service_json="$RUNNER_TEMP/openevo-candidate-service.json"
          attachment_json="$RUNNER_TEMP/openevo-candidate-attachment.json"
          cleanup() {
            PYTHONPATH= "$RUNNER_TEMP/openevo-candidate-core/bin/openevo-core-service" \
              consume-attachment \
              --attachment-name "$attachment_name" >/dev/null 2>&1 || true
            PYTHONPATH= "$RUNNER_TEMP/openevo-candidate-core/bin/openevo-core-service" stop \
              --deadline-seconds 15 >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          umask 077
          PYTHONPATH= "$RUNNER_TEMP/openevo-candidate-core/bin/openevo-core-service" ensure \
            --framework-lock "$GITHUB_WORKSPACE/candidate-artifacts/framework-lock.json" \
            --source-commit "$GITHUB_SHA" \
            --port 0 \
            --deadline-seconds 60 \
            --replace-mismatched \
            --attachment-name "$attachment_name" > "$service_json"
          PYTHONPATH= "$RUNNER_TEMP/openevo-candidate-core/bin/openevo-core-service" \
            consume-attachment \
            --attachment-name "$attachment_name" > "$attachment_json"
          PYTHONPATH= "$RUNNER_TEMP/openevo-candidate-core/bin/python" - \
            "$service_json" "$attachment_json" <<'PY'
          import json
          from pathlib import Path
          import sys
          from urllib.parse import urlencode
          from urllib.request import ProxyHandler, Request, build_opener

          service = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          attachment = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          port = service["port"]
          token = attachment["bearer_token"]
          opener = build_opener(ProxyHandler({}))
          request = Request(
              f"http://127.0.0.1:{port}/v1/capabilities?"
              + urlencode({"execution_mode": "codex_subscription_transcript"}),
              headers={"Authorization": f"Bearer {token}"},
          )
          with opener.open(request, timeout=10) as response:
              payload = json.load(response)
          profile = payload.get("evaluated_profile")
          if not isinstance(payload.get("registry_digest"), str):
              raise SystemExit("candidate subscription registry identity is unavailable")
          if not isinstance(profile, dict) or {
              "execution_mode": profile.get("execution_mode"),
              "capture_mode": profile.get("capture_mode"),
              "harness_id": profile.get("harness_id"),
          } != {
              "execution_mode": "subscription",
              "capture_mode": "transcript",
              "harness_id": "codex",
          }:
              raise SystemExit("candidate subscription capability profile is invalid")
          PY

  draft-prerelease-roundtrip:
    name: Upload and redownload unsigned draft prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [macos-candidate, linux-core-candidate]
    environment: openevo-preview-publication
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"

      - name: Download validated candidate bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openevo-desktop-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-artifacts

      - name: Revalidate candidate before draft creation
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.macos-candidate.outputs.manifest_sha256 }}
        run: |
          printf '%s  %s\n' "$EXPECTED_MANIFEST_SHA256" candidate-artifacts/release-candidate.json \
            | sha256sum --check -
          python scripts/ci/openevo_release_candidate.py validate \
            candidate-artifacts/release-candidate.json \
            --expected-source-commit "$GITHUB_SHA"

      - name: Prepare unique draft release identity
        id: release
        run: |
          version="$(python -c \
            'import json; print(json.load(open("candidate-artifacts/release-candidate.json"))["version"])')"
          tag="openevo-desktop-v${version}-${CANDIDATE_LABEL}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          title="OpenEvo Desktop ${version} Preview"
          owner="$(python -c 'import secrets; print(secrets.token_hex(16))')"
          git check-ref-format "refs/tags/$tag"

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name | @json' \
            > "$RUNNER_TEMP/releases-before-candidate.jsonl"
          python scripts/ci/openevo_release_candidate.py assert-release-absent \
            "$RUNNER_TEMP/releases-before-candidate.jsonl" \
            --expected-tag "$tag"

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1
          tag_status=$?
          set -e
          if [ "$tag_status" -eq 0 ]; then
            echo "Candidate Git tag already exists: $tag" >&2
            exit 1
          fi
          if [ "$tag_status" -ne 2 ]; then
            echo "Could not prove candidate Git tag absence: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
        env:
          CANDIDATE_LABEL: ${{ inputs.candidate_label }}
          GH_TOKEN: ${{ github.token }}

      - name: Create unsigned draft prerelease and upload exact assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_OWNER: ${{ steps.release.outputs.owner }}
        run: |
          python scripts/ci/openevo_release_candidate.py write-draft-body \
            "$RUNNER_TEMP/draft-release-body.md" \
            --release-notes candidate-artifacts/release-notes.md \
            --ownership-token "$RELEASE_OWNER"
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RUNNER_TEMP/draft-release-body.md" \
            --draft \
            --prerelease
          gh release upload "$RELEASE_TAG" candidate-artifacts/*

      - name: Verify every draft asset and review-facing field
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.macos-candidate.outputs.manifest_sha256 }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_OWNER: ${{ steps.release.outputs.owner }}
        run: |
          mkdir downloaded-draft
          gh release download "$RELEASE_TAG" --dir downloaded-draft --pattern '*'
          python scripts/ci/openevo_release_candidate.py validate \
            downloaded-draft/release-candidate.json \
            --expected-source-commit "$GITHUB_SHA"
          diff -qr candidate-artifacts downloaded-draft

          gh release view "$RELEASE_TAG" \
            --json apiUrl,body,isDraft,isPrerelease,name,tagName,targetCommitish,url \
            > "$RUNNER_TEMP/draft-release.json"
          python scripts/ci/openevo_release_candidate.py validate-draft \
            "$RUNNER_TEMP/draft-release.json" \
            --release-notes candidate-artifacts/release-notes.md \
            --expected-tag "$RELEASE_TAG" \
            --expected-target "$GITHUB_SHA" \
            --expected-title "$RELEASE_TITLE" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-owner "$RELEASE_OWNER" \
            --release-id-output "$RUNNER_TEMP/draft-release-id"
          IFS= read -r release_id < "$RUNNER_TEMP/draft-release-id"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --jq '{id,tag_name,target_commitish,name,body,draft,prerelease,html_url,immutable,assets:[.assets[]|{id,name,size,state,digest}]}' \
            > "$RUNNER_TEMP/draft-release-rest.json"
          python scripts/ci/openevo_release_candidate.py snapshot-preview \
            "$RUNNER_TEMP/preview-release-snapshot.json" \
            --metadata "$RUNNER_TEMP/draft-release-rest.json" \
            --candidate-root downloaded-draft \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-release-id "$release_id" \
            --expected-tag "$RELEASE_TAG" \
            --expected-source-commit "$GITHUB_SHA" \
            --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --state draft

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1
          tag_status=$?
          set -e
          if [ "$tag_status" -eq 0 ]; then
            echo "Draft unexpectedly created a real Git tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [ "$tag_status" -ne 2 ]; then
            echo "Could not prove candidate Git tag absence: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Retain point-in-time draft verification record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openevo-desktop-draft-verification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/draft-release.json
            ${{ runner.temp }}/preview-release-snapshot.json
          if-no-files-found: error
          retention-days: 14

      - name: Mark draft roundtrip complete
        id: verified
        run: echo "complete=true" >> "$GITHUB_OUTPUT"

      - name: Delete an owned unverified draft and verify no candidate tag
        if: ${{ always() && steps.release.outputs.tag != '' && steps.verified.outputs.complete != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_OWNER: ${{ steps.release.outputs.owner }}
        run: |
          release_found=false
          for attempt in 1 2 3; do
            if gh release view "$RELEASE_TAG" \
              --json apiUrl,body,isDraft,isPrerelease,name,tagName,targetCommitish,url \
              > "$RUNNER_TEMP/cleanup-draft-release.json"; then
              release_found=true
              break
            fi
            sleep "$attempt"
          done
          if [ "$release_found" = "true" ]; then
            if ! python scripts/ci/openevo_release_candidate.py validate-draft \
              "$RUNNER_TEMP/cleanup-draft-release.json" \
              --release-notes candidate-artifacts/release-notes.md \
              --expected-tag "$RELEASE_TAG" \
              --expected-target "$GITHUB_SHA" \
              --expected-title "$RELEASE_TITLE" \
              --expected-repository "$GITHUB_REPOSITORY" \
              --expected-owner "$RELEASE_OWNER" \
              --release-id-output "$RUNNER_TEMP/cleanup-release-id"; then
              echo "Refusing to delete a draft not owned by this workflow attempt" >&2
              exit 1
            fi
            IFS= read -r release_id < "$RUNNER_TEMP/cleanup-release-id"
            for attempt in 1 2 3; do
              if gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/${release_id}"; then
                break
              fi
              sleep "$attempt"
            done
          fi

          release_absent=false
          for attempt in 1 2 3; do
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[].tag_name | @json' \
              > "$RUNNER_TEMP/releases-after-cleanup.jsonl"
            if python scripts/ci/openevo_release_candidate.py assert-release-absent \
              "$RUNNER_TEMP/releases-after-cleanup.jsonl" \
              --expected-tag "$RELEASE_TAG"; then
              release_absent=true
              break
            fi
            sleep "$attempt"
          done
          if [ "$release_absent" != "true" ]; then
            echo "Could not prove unverified draft absence: $RELEASE_TAG" >&2
            exit 1
          fi

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1
          tag_status=$?
          set -e
          if [ "$tag_status" -eq 0 ]; then
            echo "Unverified candidate tag still exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if [ "$tag_status" -ne 2 ]; then
            echo "Could not prove unverified candidate tag absence: $RELEASE_TAG" >&2
            exit 1
          fi
