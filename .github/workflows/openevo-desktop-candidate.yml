name: OpenEvo Desktop unsigned draft prerelease

on:
  workflow_dispatch:
    inputs:
      candidate_label:
        description: Short label used in the draft prerelease tag
        required: false
        default: exhibition

permissions:
  contents: read

concurrency:
  group: openevo-desktop-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-candidate:
    name: Build and smoke unsigned macOS candidate
    runs-on: macos-14
    timeout-minutes: 150
    outputs:
      manifest_sha256: ${{ steps.candidate.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Require a reviewed stable commit and safe label
        env:
          CANDIDATE_LABEL: ${{ inputs.candidate_label }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$GITHUB_REF" = "refs/heads/stable"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          if [[ ! "$CANDIDATE_LABEL" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$ ]]; then
            echo "candidate_label must be a short filename-safe identifier" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install locked build dependencies
        run: |
          uv sync --frozen --group dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Test packaging and candidate contracts
        run: |
          uv run python -m pytest \
            tests/ci/test_build_sidecar.py \
            tests/ci/test_check_openevo_release.py \
            tests/ci/test_openevo_release_candidate.py \
            tests/ci/test_openevo_release_evidence.py \
            -q
          uv run python scripts/ci/audit_openevo_identity.py

      - name: Exercise macOS SSH agent relay and fixed executable authority
        run: |
          uv run python -m pytest \
            tests/openevo/remote/test_system_executables.py \
            tests/openevo/remote/test_host_keys.py \
            tests/openevo/remote/test_ssh_transport.py \
            -q

      - name: Resolve exact product version and runner architecture
        run: |
          version="$(uv run python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          with (root / "pyproject.toml").open("rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          renderer = json.loads((root / "desktop/package.json").read_text(encoding="utf-8"))["version"]
          tauri = json.loads(
              (root / "desktop/src-tauri/tauri.conf.json").read_text(encoding="utf-8")
          )["version"]
          if renderer != version or tauri != version:
              raise SystemExit("Core, renderer, and Tauri versions do not match")
          print(version)
          PY
          )"
          triple="$(rustc --print host-tuple)"
          case "$triple" in
            aarch64-apple-darwin) architecture="aarch64" ;;
            x86_64-apple-darwin) architecture="x64" ;;
            *) echo "Unsupported macOS runner target: $triple" >&2; exit 1 ;;
          esac
          echo "OPENEVO_VERSION=$version" >> "$GITHUB_ENV"
          echo "OPENEVO_RUST_TARGET=$triple" >> "$GITHUB_ENV"
          echo "OPENEVO_ARCHITECTURE=$architecture" >> "$GITHUB_ENV"

      - name: Test and build renderer
        working-directory: desktop
        run: |
          npm ci
          npm test -- --run
          npm run typecheck
          npm run build:openevo

      - name: Audit shipped npm dependencies
        working-directory: desktop
        run: npm audit --audit-level=high --json > "$RUNNER_TEMP/npm-audit.json" || true

      - name: Audit shipped Python dependencies
        run: |
          mkdir candidate-artifacts
          uv export --frozen --no-dev --format requirements-txt --no-hashes \
            --no-annotate --no-header --no-emit-project \
            > candidate-artifacts/python-requirements.txt
          uvx --from pip-audit==2.9.0 pip-audit \
            --requirement candidate-artifacts/python-requirements.txt \
            --format json > "$RUNNER_TEMP/pip-audit.json" || true

      - name: Audit shipped Rust dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit \
            --file desktop/src-tauri/Cargo.lock \
            --json > "$RUNNER_TEMP/cargo-audit.json" || true

      - name: Collect dependency, license, and security evidence
        run: |
          uv run python scripts/ci/collect_openevo_release_evidence.py \
            --repo "$GITHUB_WORKSPACE" \
            --output-dir candidate-artifacts \
            --npm-audit "$RUNNER_TEMP/npm-audit.json" \
            --pip-audit "$RUNNER_TEMP/pip-audit.json" \
            --pip-requirements candidate-artifacts/python-requirements.txt \
            --cargo-audit "$RUNNER_TEMP/cargo-audit.json"

      - name: Build packaged sidecar and final exact Core wheel
        working-directory: desktop
        run: |
          python packaging/build_sidecar.py \
            --core-wheel-output-dir "$RUNNER_TEMP/openevo-candidate-core"
          echo "OPENEVO_CANDIDATE_CORE=$RUNNER_TEMP/openevo-candidate-core" >> "$GITHUB_ENV"
          sidecar="$GITHUB_WORKSPACE/desktop/src-tauri/binaries/openevo-desktop-sidecar-${OPENEVO_RUST_TARGET}"
          test -x "$sidecar"
          echo "OPENEVO_PACKAGED_SIDECAR_PATH=$sidecar" >> "$GITHUB_ENV"

      - name: Clean-install and verify final Core wheel and framework lock
        run: |
          test "$(find "$OPENEVO_CANDIDATE_CORE" -maxdepth 1 -name 'openevo-*.whl' | wc -l | tr -d ' ')" = 1
          test -f "$OPENEVO_CANDIDATE_CORE/framework-lock.json"
          python -m venv "$RUNNER_TEMP/openevo-core-wheel-smoke"
          "$RUNNER_TEMP/openevo-core-wheel-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/openevo-core-wheel-smoke/bin/python" -m pip install "$OPENEVO_CANDIDATE_CORE"/openevo-*.whl
          PYTHONPATH= "$RUNNER_TEMP/openevo-core-wheel-smoke/bin/openevo-backend" --help
          PYTHONPATH= "$RUNNER_TEMP/openevo-core-wheel-smoke/bin/openevo-core-service" --help
          PYTHONPATH= "$RUNNER_TEMP/openevo-core-wheel-smoke/bin/python" \
            scripts/ci/smoke_evolution_framework_wheel.py \
            --wheel "$OPENEVO_CANDIDATE_CORE"/openevo-*.whl \
            --framework-lock "$OPENEVO_CANDIDATE_CORE/framework-lock.json" \
            > "$RUNNER_TEMP/framework-smoke.json"
          registry_digest="$(uv run python -c \
            'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["registry_digest"])' \
            "$RUNNER_TEMP/framework-smoke.json")"
          test "${#registry_digest}" = 64
          echo "OPENEVO_REGISTRY_DIGEST=$registry_digest" >> "$GITHUB_ENV"

      - name: Check release-mode Tauri host
        working-directory: desktop/src-tauri
        run: |
          cargo metadata --locked --format-version 1
          cargo fmt --check
          cargo check --locked --release --all-targets
          cargo clippy --locked --release --all-targets -- -D warnings
          cargo test --locked --release
          cargo test --locked tests::packaged_external_bin_native_launch_smoke -- --ignored --exact

      - name: Build unsigned Desktop DMG for the runner architecture
        working-directory: desktop
        run: npm run tauri:build -- --ci

      - name: Require native binary inspection tools
        run: |
          file --version
          lipo -version

      - name: Copy exact candidate bytes
        run: |
          dmg_count="$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')"
          test "$dmg_count" = 1
          dmg_source="$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print)"
          cp "$dmg_source" \
            "candidate-artifacts/OpenEvo-Desktop-${OPENEVO_VERSION}-${OPENEVO_ARCHITECTURE}.dmg"
          cp "$OPENEVO_CANDIDATE_CORE"/openevo-*.whl candidate-artifacts/
          cp "$OPENEVO_CANDIDATE_CORE/framework-lock.json" candidate-artifacts/

      - name: Launch real app bundle and record native evidence
        run: |
          uv run python scripts/ci/smoke_openevo_desktop_bundle.py \
            "desktop/src-tauri/target/release/bundle/macos/OpenEvo Desktop.app" \
            --timeout-seconds 60 \
            --evidence-out candidate-artifacts/app-bundle-smoke.json

      - name: Mount, copy, detach, and launch the real DMG app
        run: |
          mount_dir="$(mktemp -d)"
          copy_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rm -rf "$mount_dir" "$copy_dir"
          }
          trap cleanup EXIT
          dmg="candidate-artifacts/OpenEvo-Desktop-${OPENEVO_VERSION}-${OPENEVO_ARCHITECTURE}.dmg"
          hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse -readonly
          test -d "$mount_dir/OpenEvo Desktop.app"
          ditto "$mount_dir/OpenEvo Desktop.app" "$copy_dir/OpenEvo Desktop.app"
          hdiutil detach "$mount_dir" -quiet
          uv run python scripts/ci/smoke_openevo_desktop_bundle.py \
            "$copy_dir/OpenEvo Desktop.app" \
            --timeout-seconds 60 \
            --evidence-out candidate-artifacts/dmg-copy-smoke.json

      - name: Write release notes and authoritative candidate manifest
        id: candidate
        run: |
          cat > candidate-artifacts/release-notes.md <<EOF
          # OpenEvo Desktop ${OPENEVO_VERSION} unsigned draft prerelease

          Source commit: ${GITHUB_SHA}
          Architecture: ${OPENEVO_ARCHITECTURE}
          Minimum macOS: 12.0

          This candidate is unsigned and not notarized. macOS users must manually
          allow OpenEvo Desktop in Privacy & Security after the first launch.

          ## Supported Workflows

          Codex subscription transcript mode: runs subscription-authenticated Codex
          on the remote server with transcript capture and non-parametric evolution.
          Self-Deployed Reference mode: runs the reference remote model-serving path
          with the same non-parametric evolution targets.
          Both modes use the remote OpenEvo Core Backend; Desktop does not call a
          model API directly.

          ## Known Limitations

          Parameter evolution is not included in this candidate.
          PyPI is not used for this release.
          Only the declared architecture was built.
          This packaging-only draft does not satisfy the science E2E, benchmark,
          secret-canary/privacy, signing, notarization, or final-publication gates.

          ## Validation Results

          Benchmark gates completed by this packaging candidate: 0 of 3.
          Textual-memory pass@1 rescue count: pending.
          Trajectory-to-skill pass@1 rescue count: pending.
          Agent-system pass@1 rescue count: pending.
          No benchmark performance claim is made by this draft.
          The exact Core wheel, app bundle, copied DMG app, dependency evidence, and
          downloaded draft assets are validated by this workflow.

          ## Security And Privacy

          No analytics, crash reporting, telemetry, or diagnostics upload is enabled by default.
          Release assets contain no credentials.
          Diagnostics sharing is explicit. Science data can be sent to the remote
          server and harness or model provider selected by the user. The full
          secret-canary/privacy release gate remains pending.

          ## Install, Upgrade, And Uninstall

          Install: open the DMG, copy OpenEvo Desktop to Applications, and manually
          allow the unsigned app in Privacy & Security on first launch.
          Upgrade: this draft has no automatic updater; quit the app and replace it
          with a newer reviewed DMG. Remote Core upgrade compatibility is not proven
          by this packaging-only candidate.
          Uninstall: quit OpenEvo Desktop and remove it from Applications. Removing
          the app does not automatically delete remote Core state, task data, model
          downloads, or runtime caches.
          EOF
          uv run python scripts/ci/openevo_release_candidate.py create \
            candidate-artifacts \
            --source-commit "$GITHUB_SHA" \
            --version "$OPENEVO_VERSION" \
            --architecture "$OPENEVO_ARCHITECTURE" \
            --rust-target "$OPENEVO_RUST_TARGET" \
            --registry-digest "$OPENEVO_REGISTRY_DIGEST"
          uv run python scripts/ci/openevo_release_candidate.py validate \
            candidate-artifacts/release-candidate.json \
            --expected-source-commit "$GITHUB_SHA" \
            --expected-core-platform linux-x86_64
          test -f candidate-artifacts/core-install-artifact.json
          test -f candidate-artifacts/SHA256SUMS
          manifest_sha256="$(shasum -a 256 candidate-artifacts/release-candidate.json | awk '{print $1}')"
          test "${#manifest_sha256}" = 64
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload exact candidate for cross-platform verification
        uses: actions/upload-artifact@v4
        with:
          name: openevo-desktop-candidate-${{ github.sha }}
          path: candidate-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Retain failed supply-chain summaries
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openevo-desktop-candidate-failure-evidence-${{ github.sha }}
          path: |
            candidate-artifacts/dependency-inventory.json
            candidate-artifacts/license-inventory.json
            candidate-artifacts/security-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove generated build inventory
        if: always()
        run: |
          if [ -n "${OPENEVO_PACKAGED_SIDECAR_PATH:-}" ]; then
            rm -f "$OPENEVO_PACKAGED_SIDECAR_PATH"
          fi
          rm -rf \
            .candidate-core \
            desktop/packaging/sidecar-build \
            desktop/packaging/sidecar-dist

  linux-core-candidate:
    name: Verify exact candidate Core bytes on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: macos-candidate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Install locked smoke dependencies
        run: uv sync --frozen --group dev

      - name: Download exact final candidate bytes
        uses: actions/download-artifact@v4
        with:
          name: openevo-desktop-candidate-${{ github.sha }}
          path: candidate-artifacts

      - name: Verify candidate manifest and transferred manifest bytes
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.macos-candidate.outputs.manifest_sha256 }}
        run: |
          test "${#EXPECTED_MANIFEST_SHA256}" = 64
          printf '%s  %s\n' "$EXPECTED_MANIFEST_SHA256" candidate-artifacts/release-candidate.json \
            | sha256sum --check -
          uv run python scripts/ci/openevo_release_candidate.py validate \
            candidate-artifacts/release-candidate.json \
            --expected-source-commit "$GITHUB_SHA" \
            --expected-core-platform linux-x86_64

      - name: Install and verify the exact candidate Core wheel
        run: |
          python -m venv "$RUNNER_TEMP/openevo-candidate-core"
          "$RUNNER_TEMP/openevo-candidate-core/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/openevo-candidate-core/bin/python" -m pip install candidate-artifacts/openevo-*.whl
          PYTHONPATH= "$RUNNER_TEMP/openevo-candidate-core/bin/openevo-backend" --help
          PYTHONPATH= "$RUNNER_TEMP/openevo-candidate-core/bin/openevo-core-service" --help
          PYTHONPATH= "$RUNNER_TEMP/openevo-candidate-core/bin/python" \
            scripts/ci/smoke_evolution_framework_wheel.py \
            --wheel candidate-artifacts/openevo-*.whl \
            --framework-lock candidate-artifacts/framework-lock.json \
            > "$RUNNER_TEMP/linux-framework-smoke.json"
          uv run python - "$RUNNER_TEMP/linux-framework-smoke.json" \
            candidate-artifacts/release-candidate.json <<'PY'
          import json
          from pathlib import Path
          import sys

          smoke = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          candidate = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if smoke["registry_digest"] != candidate["core"]["registry_digest"]:
              raise SystemExit("Linux registry digest differs from the candidate manifest")
          PY

      - name: Smoke exact candidate Core service lifecycle
        run: |
          set -euo pipefail
          service_root="$RUNNER_TEMP/openevo-candidate-core-service"
          attachment_name="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          service_json="$RUNNER_TEMP/openevo-candidate-service.json"
          attachment_json="$RUNNER_TEMP/openevo-candidate-attachment.json"
          cleanup() {
            PYTHONPATH= "$RUNNER_TEMP/openevo-candidate-core/bin/openevo-core-service" stop \
              --service-root "$service_root" --deadline-seconds 15 >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          umask 077
          PYTHONPATH= "$RUNNER_TEMP/openevo-candidate-core/bin/openevo-core-service" ensure \
            --service-root "$service_root" \
            --framework-lock "$GITHUB_WORKSPACE/candidate-artifacts/framework-lock.json" \
            --source-commit "$GITHUB_SHA" \
            --port 0 \
            --deadline-seconds 60 \
            --replace-mismatched \
            --attachment-name "$attachment_name" > "$service_json"
          PYTHONPATH= "$RUNNER_TEMP/openevo-candidate-core/bin/openevo-core-service" \
            consume-attachment \
            --service-root "$service_root" \
            --attachment-name "$attachment_name" > "$attachment_json"
          PYTHONPATH= "$RUNNER_TEMP/openevo-candidate-core/bin/python" - \
            "$service_json" "$attachment_json" <<'PY'
          import json
          from pathlib import Path
          import sys
          from urllib.parse import urlencode
          from urllib.request import ProxyHandler, Request, build_opener

          service = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          attachment = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          port = service["port"]
          token = attachment["bearer_token"]
          opener = build_opener(ProxyHandler({}))
          digests = set()
          for mode in ("codex_subscription_transcript", "self-deployed"):
              request = Request(
                  f"http://127.0.0.1:{port}/v1/capabilities?"
                  + urlencode({"execution_mode": mode}),
                  headers={"Authorization": f"Bearer {token}"},
              )
              with opener.open(request, timeout=10) as response:
                  payload = json.load(response)
              digests.add(payload["registry_digest"])
          if len(digests) != 1:
              raise SystemExit("candidate Core release modes returned different registries")
          PY

  draft-prerelease-roundtrip:
    name: Upload and redownload unsigned draft prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [macos-candidate, linux-core-candidate]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download validated candidate bytes
        uses: actions/download-artifact@v4
        with:
          name: openevo-desktop-candidate-${{ github.sha }}
          path: candidate-artifacts

      - name: Revalidate candidate before draft creation
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.macos-candidate.outputs.manifest_sha256 }}
        run: |
          printf '%s  %s\n' "$EXPECTED_MANIFEST_SHA256" candidate-artifacts/release-candidate.json \
            | sha256sum --check -
          python scripts/ci/openevo_release_candidate.py validate \
            candidate-artifacts/release-candidate.json \
            --expected-source-commit "$GITHUB_SHA"

      - name: Create unsigned draft prerelease and upload exact assets
        id: release
        env:
          CANDIDATE_LABEL: ${{ inputs.candidate_label }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python -c \
            'import json; print(json.load(open("candidate-artifacts/release-candidate.json"))["version"])')"
          tag="openevo-desktop-v${version}-${CANDIDATE_LABEL}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "OpenEvo Desktop ${version} unsigned candidate" \
            --notes-file candidate-artifacts/release-notes.md \
            --draft \
            --prerelease
          gh release upload "$tag" candidate-artifacts/*

      - name: Download every draft asset into a clean directory and verify exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir downloaded-draft
          gh release download "$RELEASE_TAG" --dir downloaded-draft --pattern '*'
          python scripts/ci/openevo_release_candidate.py validate \
            downloaded-draft/release-candidate.json \
            --expected-source-commit "$GITHUB_SHA"
          diff -qr candidate-artifacts downloaded-draft

      - name: Delete an unverified draft and its candidate tag
        if: failure() && steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release delete "$RELEASE_TAG" --yes --cleanup-tag
