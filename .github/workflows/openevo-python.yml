name: OpenEvo self-hosted WebUI and Core checks

on:
  workflow_dispatch:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/openevo-python.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/openevo/**"
      - "scripts/dev/**"
      - "desktop/**"
      - "tests/**"
      - "benchmarks/terminal_bench/**"

jobs:
  python-tests:
    name: Python runtime and Web Layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio ruff==0.15.12
      - name: Lint
        run: ruff check src tests scripts
      - name: Run regressions
        run: |
          umask 077
          python -m pytest \
            tests/ci \
            tests/daemon \
            tests/dev/test_run_remote_agent_development.py \
            tests/dev/test_live_agent_daemon.py \
            tests/dev/test_development_agent_web_layer.py \
            tests/openevo/sidecar/test_browser_host.py \
            tests/openevo/sidecar/test_desktop_contract_v2.py \
            tests/openevo/sidecar/test_event_broker_v2.py \
            tests/backend/test_evolution_runtime.py \
            tests/backend/test_workspace_handoff_v2.py \
            -q

  webui:
    name: Self-hosted WebUI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run typecheck
      - run: npm run build:webui-gateway

  terminal-bench-tests:
    name: Standalone Terminal Bench package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -e benchmarks/terminal_bench
          python -m pip install pytest ruff==0.15.12 build
      - run: ruff check benchmarks/terminal_bench
      - run: python -m pytest benchmarks/terminal_bench/tests -q
