name: OpenEvo packaged sidecar + installed Core release smoke

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/openevo-release-smoke.yml"
      - ".gitignore"
      - "AGENTS.md"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
      - "docs/architecture/**"
      - "docs/core/**"
      - "docs/maintainer/**"
      - "docs/user/**"
      - "examples/**"
      - "scripts/ci/**"
      - "src/openevo/**"
      - "src/slime_bridge/**"
      - "desktop/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  macos-packaging-smoke:
    name: macOS packaging + exact Core pair publication
    runs-on: macos-14
    outputs:
      manifest_sha256: ${{ steps.release_inputs.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Require an ephemeral GitHub-hosted release runner
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: test "$RUNNER_ENVIRONMENT" = "github-hosted"

      - name: Test release validator and packaging contracts
        run: |
          uv sync --frozen --group dev
          uv run python -m pytest \
            tests/ci/test_build_sidecar.py \
            tests/ci/test_check_openevo_release.py \
            tests/ci/test_openevo_productization_workflow.py \
            tests/ci/test_productization_spec.py \
            tests/openevo/sidecar/test_provider_store.py::test_sqlite_connection_accepts_an_inode_identical_ancestor_alias \
            tests/openevo/sidecar/test_provider_store.py::test_standard_sqlite_rollback_journal_recovers_a_crashed_transaction \
            tests/openevo/sidecar/test_core_bridge_store_v1.py::test_darwin_sqlite_connection_uses_managed_path_and_persists_writes \
            tests/openevo/sidecar/test_core_bridge_store_v1.py::test_sqlite_connection_accepts_an_inode_identical_ancestor_alias \
            tests/openevo/sidecar/test_core_bridge_store_v1.py::test_open_store_rejects_database_pathname_replacement \
            tests/openevo/sidecar/test_core_bridge_store_v1.py::test_fresh_initial_schema_hot_journal_rolls_back_then_bootstraps \
            -q
          uv run python scripts/ci/audit_openevo_identity.py

      - name: Build OpenEvo Desktop assets
        working-directory: desktop
        run: |
          npm ci
          npm audit --audit-level=high
          npm test -- --run
          npm run typecheck
          npm run build:openevo

      - name: Check packaged Desktop assets are current
        run: |
          diff -qr desktop/dist desktop/packaging/web

      - name: Build and smoke packaged macOS Desktop sidecar
        run: |
          uv run python desktop/packaging/build_sidecar.py \
            --core-wheel-output-dir "$RUNNER_TEMP/openevo-release-inputs"
          echo "OPENEVO_RELEASE_INPUTS=$RUNNER_TEMP/openevo-release-inputs" >> "$GITHUB_ENV"
          sidecar="desktop/src-tauri/binaries/openevo-desktop-sidecar-$(rustc --print host-tuple)"
          uv run python scripts/ci/smoke_openevo_desktop_sidecar.py \
            "$sidecar" \
            --timeout-seconds 60

      - name: Create and verify exact Core release input manifest
        id: release_inputs
        run: |
          test "$(find "$OPENEVO_RELEASE_INPUTS" -maxdepth 1 -name 'openevo-*.whl' | wc -l | tr -d ' ')" = 1
          test -f "$OPENEVO_RELEASE_INPUTS/framework-lock.json"
          (
            cd "$OPENEVO_RELEASE_INPUTS"
            shasum -a 256 openevo-*.whl framework-lock.json > SHA256SUMS
            test "$(wc -l < SHA256SUMS | tr -d ' ')" = 2
            shasum -a 256 --check SHA256SUMS
          )
          test "$(find "$OPENEVO_RELEASE_INPUTS" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 3
          manifest_sha256="$(shasum -a 256 "$OPENEVO_RELEASE_INPUTS/SHA256SUMS" | awk '{print $1}')"
          test "${#manifest_sha256}" = 64
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload exact Core release inputs
        uses: actions/upload-artifact@v4
        with:
          name: openevo-core-release-inputs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openevo-release-inputs/openevo-*.whl
            ${{ runner.temp }}/openevo-release-inputs/framework-lock.json
            ${{ runner.temp }}/openevo-release-inputs/SHA256SUMS
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  linux-core-smoke:
    name: Linux Core service + exact release identity
    runs-on: ubuntu-latest
    needs: macos-packaging-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: astral-sh/setup-uv@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux release smoke dependencies
        run: uv sync --frozen --group dev

      - name: Download exact Core release inputs
        uses: actions/download-artifact@v4
        with:
          name: openevo-core-release-inputs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .openevo-release-inputs

      - name: Verify transferred Core release input manifest
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.macos-packaging-smoke.outputs.manifest_sha256 }}
        run: |
          test "${#EXPECTED_MANIFEST_SHA256}" = 64
          printf '%s  %s\n' "$EXPECTED_MANIFEST_SHA256" .openevo-release-inputs/SHA256SUMS \
            | sha256sum --check -
          (
            cd .openevo-release-inputs
            test "$(wc -l < SHA256SUMS | tr -d ' ')" = 2
            sha256sum --check SHA256SUMS
          )
          test "$(find .openevo-release-inputs -maxdepth 1 -name 'openevo-*.whl' | wc -l | tr -d ' ')" = 1
          test -f .openevo-release-inputs/framework-lock.json
          test "$(find .openevo-release-inputs -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 3

      - name: Install and verify exact Core release identity
        run: |
          python -m venv .openevo-core-smoke
          .openevo-core-smoke/bin/python -m pip install --upgrade pip
          .openevo-core-smoke/bin/python -m pip install .openevo-release-inputs/openevo-*.whl
          PYTHONPATH= .openevo-core-smoke/bin/openevo-backend --help
          PYTHONPATH= .openevo-core-smoke/bin/openevo-backend serve --help
          PYTHONPATH= .openevo-core-smoke/bin/openevo-backend run --help
          PYTHONPATH= .openevo-core-smoke/bin/python scripts/ci/smoke_evolution_framework_wheel.py \
            --wheel .openevo-release-inputs/openevo-*.whl \
            --framework-lock .openevo-release-inputs/framework-lock.json

      - name: Build executable Linux packaged sidecar fixture
        run: |
          cd desktop
          npm ci
          uv run python packaging/build_sidecar.py
          sidecar="$GITHUB_WORKSPACE/desktop/src-tauri/binaries/openevo-desktop-sidecar-$(rustc --print host-tuple)"
          test -x "$sidecar"
          echo "OPENEVO_LINUX_PACKAGED_SIDECAR=$sidecar" >> "$GITHUB_ENV"

      - name: Smoke exact transferred Core release through Linux packaged sidecar gate
        run: |
          set -euo pipefail
          test -x "$OPENEVO_LINUX_PACKAGED_SIDECAR"
          PYTHONPATH= .openevo-core-smoke/bin/python \
            scripts/ci/smoke_openevo_remote_capabilities.py \
            --wheel .openevo-release-inputs/openevo-*.whl \
            --framework-lock .openevo-release-inputs/framework-lock.json \
            --sidecar "$OPENEVO_LINUX_PACKAGED_SIDECAR" \
            --source-commit "$GITHUB_SHA" \
            --timeout-seconds 60

      - name: Reverify final Core candidate bytes after service smoke
        run: |
          (
            cd .openevo-release-inputs
            sha256sum --check SHA256SUMS
          )
          test "$(find .openevo-release-inputs -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 3
