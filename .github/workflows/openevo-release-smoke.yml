name: OpenEvo packaged sidecar + installed Core release smoke

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/openevo-release-smoke.yml"
      - ".gitignore"
      - "AGENTS.md"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
      - "docs/architecture/**"
      - "docs/core/**"
      - "docs/maintainer/**"
      - "docs/user/**"
      - "examples/**"
      - "scripts/ci/**"
      - "src/openevo/**"
      - "src/slime_bridge/**"
      - "desktop/**"
      - "tests/**"

jobs:
  wheel-smoke:
    name: packaged sidecar + installed Core + source outer harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build OpenEvo Desktop assets
        working-directory: desktop
        run: |
          npm ci
          npm audit --audit-level=high
          npm test -- --run
          npm run typecheck
          npm run build:openevo

      - name: Check packaged Desktop assets are current
        run: |
          diff -qr desktop/dist desktop/packaging/web

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Test release validator
        run: |
          uv sync --frozen --group dev
          uv run python -m pytest \
            tests/ci/test_build_sidecar.py \
            tests/ci/test_check_openevo_release.py \
            tests/ci/test_openevo_productization_workflow.py \
            tests/ci/test_productization_spec.py \
            -q
          uv run python scripts/ci/audit_openevo_identity.py

      - name: Build and smoke packaged Desktop sidecar
        run: |
          uv run python desktop/packaging/build_sidecar.py \
            --core-wheel-output-dir .openevo-remote-wheel
          test "$(find .openevo-remote-wheel -maxdepth 1 -type f -name 'openevo-*.whl' | wc -l)" -eq 1
          test -f .openevo-remote-wheel/framework-lock.json
          test "$(find .openevo-remote-wheel -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2
          uv run python scripts/ci/smoke_openevo_desktop_sidecar.py \
            "desktop/src-tauri/binaries/openevo-desktop-sidecar-$(rustc --print host-tuple)" \
            --timeout-seconds 60

      - name: Build outer smoke wheel from isolated source
        run: |
          test "$(find .openevo-remote-wheel -maxdepth 1 -name 'openevo-*.whl' | wc -l)" -eq 1
          rm -rf dist
          outer_source="$(mktemp -d)"
          trap 'rm -rf "$outer_source"' EXIT
          cp pyproject.toml README.md LICENSE "$outer_source/"
          mkdir -p "$outer_source/src"
          rsync -a \
            --exclude 'wheels/' \
            --exclude '*.egg-info/' \
            --exclude '__pycache__/' \
            src/ "$outer_source/src/"
          mkdir -p "$outer_source/src/openevo/wheels"
          cp .openevo-remote-wheel/openevo-*.whl "$outer_source/src/openevo/wheels/"
          uv run python -m build --wheel --no-isolation \
            --outdir "$GITHUB_WORKSPACE/dist" "$outer_source"

      - name: Validate OpenEvo wheel
        run: |
          uv run python scripts/ci/check_openevo_release.py --wheel dist/*.whl

      - name: Smoke exact remote Core wheel
        run: |
          sidecar="desktop/src-tauri/binaries/openevo-desktop-sidecar-$(rustc --print host-tuple)"
          python -m venv .openevo-remote-wheel-smoke
          .openevo-remote-wheel-smoke/bin/python -m pip install --upgrade pip
          .openevo-remote-wheel-smoke/bin/python -m pip install .openevo-remote-wheel/*.whl
          .openevo-remote-wheel-smoke/bin/openevo-backend --help
          .openevo-remote-wheel-smoke/bin/openevo-backend serve --help
          .openevo-remote-wheel-smoke/bin/openevo-backend run --help
          .openevo-remote-wheel-smoke/bin/openevo-core-service --help
          PYTHONPATH= .openevo-remote-wheel-smoke/bin/python scripts/ci/smoke_evolution_framework_wheel.py \
            --wheel .openevo-remote-wheel/*.whl \
            --framework-lock .openevo-remote-wheel/framework-lock.json
          PYTHONPATH= .openevo-remote-wheel-smoke/bin/python scripts/ci/smoke_openevo_remote_capabilities.py \
            --wheel .openevo-remote-wheel/*.whl \
            --framework-lock .openevo-remote-wheel/framework-lock.json \
            --sidecar "$sidecar" \
            --source-commit "$(git rev-parse HEAD)" \
            --timeout-seconds 60

      - name: Smoke installed Core with source Desktop harness
        run: |
          python -m venv .openevo-wheel-smoke
          .openevo-wheel-smoke/bin/python -m pip install --upgrade pip
          .openevo-wheel-smoke/bin/python -m pip install dist/*.whl
          PYTHONPATH=. .openevo-wheel-smoke/bin/python scripts/ci/smoke_openevo_desktop_wheel.py
