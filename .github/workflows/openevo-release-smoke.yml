name: OpenEvo packaged sidecar + installed Core release smoke

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/openevo-release-smoke.yml"
      - ".gitignore"
      - "AGENTS.md"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
      - "docs/architecture/**"
      - "docs/core/**"
      - "docs/maintainer/**"
      - "docs/user/**"
      - "examples/**"
      - "scripts/ci/**"
      - "src/openevo/**"
      - "src/slime_bridge/**"
      - "desktop/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  macos-packaging-smoke:
    name: macOS packaging + APFS held-FD cleanup
    runs-on: macos-14
    outputs:
      manifest_sha256: ${{ steps.release_inputs.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Test release validator and packaging contracts
        run: |
          uv sync --frozen --group dev
          uv run python -m pytest \
            tests/ci/test_build_sidecar.py \
            tests/ci/test_check_openevo_release.py \
            tests/ci/test_openevo_productization_workflow.py \
            tests/ci/test_productization_spec.py \
            -q
          uv run python scripts/ci/audit_openevo_identity.py

      - name: Build OpenEvo Desktop assets
        working-directory: desktop
        run: |
          npm ci
          npm audit --audit-level=high
          npm test -- --run
          npm run typecheck
          npm run build:openevo

      - name: Check packaged Desktop assets are current
        run: |
          diff -qr desktop/dist desktop/packaging/web

      - name: Build and smoke packaged macOS Desktop sidecar
        run: |
          uv run python desktop/packaging/build_sidecar.py \
            --core-wheel-output-dir .openevo-release-inputs
          sidecar="desktop/src-tauri/binaries/openevo-desktop-sidecar-$(rustc --print host-tuple)"
          uv run python scripts/ci/smoke_openevo_desktop_sidecar.py \
            "$sidecar" \
            --timeout-seconds 60

      - name: Probe APFS held-FD to FSRef to FSUnlinkObject cleanup
        run: |
          diskutil info "$RUNNER_TEMP" \
            | grep -Eiq '^[[:space:]]*(File System Personality|Type \(Bundle\)):[[:space:]]*APFS'
          uv run python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import tempfile

          path = Path("desktop/packaging/build_sidecar.py").resolve()
          spec = importlib.util.spec_from_file_location("openevo_build_sidecar_probe", path)
          if spec is None or spec.loader is None:
              raise SystemExit("could not load the sidecar builder")
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          if not builder._core_release_fd_removal_supported():
              raise SystemExit("macOS identity-bound cleanup is unavailable")

          native_calls = []
          prepare_fsref = builder._prepare_core_release_fd_removal
          execute_fsunlink = builder._execute_core_release_fd_removal

          def record_prepare(object_fd, *, is_directory):
              token = prepare_fsref(object_fd, is_directory=is_directory)
              native_calls.append("FSPathMakeRef")
              return token

          def record_execute(token, parent_fd, name, object_fd, *, is_directory):
              execute_fsunlink(
                  token,
                  parent_fd,
                  name,
                  object_fd,
                  is_directory=is_directory,
              )
              native_calls.append("FSUnlinkObject")

          builder._prepare_core_release_fd_removal = record_prepare
          builder._execute_core_release_fd_removal = record_execute

          with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as temporary:
              root = Path(temporary)
              target = root / "held-fd-fsref-probe"
              target.write_bytes(b"openevo-fsref-probe")
              target.chmod(0o600)
              parent_fd = os.open(root, os.O_RDONLY | os.O_DIRECTORY)
              object_fd = os.open(target, os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  descriptor = os.fstat(object_fd)
                  builder._remove_core_release_fd_bound_entry(
                      parent_fd,
                      target.name,
                      object_fd,
                      identity=(descriptor.st_dev, descriptor.st_ino),
                      is_directory=False,
                      subject="APFS held-FD FSRef probe",
                  )
              finally:
                  os.close(object_fd)
                  os.close(parent_fd)
              if target.exists():
                  raise SystemExit("FSUnlinkObject did not unlink the held object")
          if native_calls != ["FSPathMakeRef", "FSUnlinkObject"]:
              raise SystemExit(f"unexpected native cleanup calls: {native_calls}")
          PY

      - name: Create and verify exact Core release input manifest
        id: release_inputs
        run: |
          test "$(find .openevo-release-inputs -maxdepth 1 -name 'openevo-*.whl' | wc -l | tr -d ' ')" = 1
          test -f .openevo-release-inputs/framework-lock.json
          (
            cd .openevo-release-inputs
            shasum -a 256 openevo-*.whl framework-lock.json > SHA256SUMS
            test "$(wc -l < SHA256SUMS | tr -d ' ')" = 2
            shasum -a 256 --check SHA256SUMS
          )
          test "$(find .openevo-release-inputs -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 3
          manifest_sha256="$(shasum -a 256 .openevo-release-inputs/SHA256SUMS | awk '{print $1}')"
          test "${#manifest_sha256}" = 64
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload exact Core release inputs
        uses: actions/upload-artifact@v4
        with:
          name: openevo-core-release-inputs-${{ github.sha }}
          path: |
            .openevo-release-inputs/openevo-*.whl
            .openevo-release-inputs/framework-lock.json
            .openevo-release-inputs/SHA256SUMS
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  linux-core-smoke:
    name: Linux Core service + exact release identity
    runs-on: ubuntu-latest
    needs: macos-packaging-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: astral-sh/setup-uv@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux release smoke dependencies
        run: uv sync --frozen --group dev

      - name: Download exact Core release inputs
        uses: actions/download-artifact@v4
        with:
          name: openevo-core-release-inputs-${{ github.sha }}
          path: .openevo-release-inputs

      - name: Verify transferred Core release input manifest
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.macos-packaging-smoke.outputs.manifest_sha256 }}
        run: |
          test "${#EXPECTED_MANIFEST_SHA256}" = 64
          printf '%s  %s\n' "$EXPECTED_MANIFEST_SHA256" .openevo-release-inputs/SHA256SUMS \
            | sha256sum --check -
          (
            cd .openevo-release-inputs
            test "$(wc -l < SHA256SUMS | tr -d ' ')" = 2
            sha256sum --check SHA256SUMS
          )
          test "$(find .openevo-release-inputs -maxdepth 1 -name 'openevo-*.whl' | wc -l | tr -d ' ')" = 1
          test -f .openevo-release-inputs/framework-lock.json
          test "$(find .openevo-release-inputs -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 3

      - name: Install and verify exact Core release identity
        run: |
          python -m venv .openevo-core-smoke
          .openevo-core-smoke/bin/python -m pip install --upgrade pip
          .openevo-core-smoke/bin/python -m pip install .openevo-release-inputs/openevo-*.whl
          PYTHONPATH= .openevo-core-smoke/bin/openevo-backend --help
          PYTHONPATH= .openevo-core-smoke/bin/openevo-backend serve --help
          PYTHONPATH= .openevo-core-smoke/bin/openevo-backend run --help
          PYTHONPATH= .openevo-core-smoke/bin/python scripts/ci/smoke_evolution_framework_wheel.py \
            --wheel .openevo-release-inputs/openevo-*.whl \
            --framework-lock .openevo-release-inputs/framework-lock.json

      - name: Build executable Linux packaged sidecar fixture
        run: |
          cd desktop
          npm ci
          uv run python packaging/build_sidecar.py
          sidecar="$GITHUB_WORKSPACE/desktop/src-tauri/binaries/openevo-desktop-sidecar-$(rustc --print host-tuple)"
          test -x "$sidecar"
          echo "OPENEVO_LINUX_PACKAGED_SIDECAR=$sidecar" >> "$GITHUB_ENV"

      - name: Smoke exact transferred Core release through Linux packaged sidecar gate
        run: |
          set -euo pipefail
          test -x "$OPENEVO_LINUX_PACKAGED_SIDECAR"
          PYTHONPATH= .openevo-core-smoke/bin/python \
            scripts/ci/smoke_openevo_remote_capabilities.py \
            --wheel .openevo-release-inputs/openevo-*.whl \
            --framework-lock .openevo-release-inputs/framework-lock.json \
            --sidecar "$OPENEVO_LINUX_PACKAGED_SIDECAR" \
            --source-commit "$GITHUB_SHA" \
            --timeout-seconds 60

      - name: Reverify final Core candidate bytes after service smoke
        run: |
          (
            cd .openevo-release-inputs
            sha256sum --check SHA256SUMS
          )
          test "$(find .openevo-release-inputs -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 3
