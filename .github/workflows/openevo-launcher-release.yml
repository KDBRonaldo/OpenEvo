name: EvoLab installable pre-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: evolab-launcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build repository-free installers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Require an exact version tag
        shell: bash
        run: |
          set -euo pipefail
          product_version=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )
          expected_tag="v${product_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $expected_tag" >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "$GITHUB_REF_NAME")" != "$(git rev-parse HEAD)" ]]; then
            echo "The checked out commit is not the commit named by $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Verify committed WebUI matches its source
        working-directory: desktop
        run: |
          npm ci
          npm test -- --run
          npm run typecheck
          npm run build:webui-gateway
          git diff --exit-code -- ../src/openevo/web_gateway/static

      - name: Run release packaging tests
        run: |
          python -m pip install pytest
          python -m pytest \
            tests/release/test_release_bundle.py \
            tests/release/test_launcher_distribution.py \
            tests/release/test_online_installer.py \
            tests/release/test_release_notes.py \
            -q

      - name: Build the launcher ZIP
        run: |
          set -euo pipefail
          mkdir -p dist
          python scripts/release/build_launcher_distribution.py \
            --commit HEAD \
            --output dist/evolab-launcher.zip

      - uses: actions/upload-artifact@v4
        with:
          name: evolab-${{ github.ref_name }}-launcher
          if-no-files-found: error
          retention-days: 7
          path: dist/evolab-launcher.zip

  macos-install-smoke:
    name: Install and launch help on macOS
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: evolab-${{ github.ref_name }}-launcher

      - name: Install the packaged launcher
        shell: bash
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/evolab-package"
          prefix="$RUNNER_TEMP/evolab-installed"
          mkdir -p "$package_root"
          unzip -q evolab-launcher.zip -d "$package_root"
          sh "$package_root/evolab-launcher/install.sh" \
            --prefix "$prefix"
          "$prefix/bin/evolab" webui --help

  wsl-install-smoke:
    name: Install and launch help on WSL-compatible Linux
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: evolab-${{ github.ref_name }}-launcher

      - name: Install the same package on Linux
        shell: bash
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/evolab-package"
          prefix="$RUNNER_TEMP/evolab-installed"
          mkdir -p "$package_root"
          unzip -q evolab-launcher.zip -d "$package_root"
          sh "$package_root/evolab-launcher/install.sh" \
            --prefix "$prefix"
          "$prefix/bin/evolab" webui --help

  windows-install-smoke:
    name: Install and launch help on native Windows
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: evolab-${{ github.ref_name }}-launcher

      - name: Install the same package with PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageRoot = Join-Path $env:RUNNER_TEMP "evolab-package"
          $prefix = Join-Path $env:RUNNER_TEMP "evolab-installed"
          Expand-Archive -LiteralPath "evolab-launcher.zip" -DestinationPath $packageRoot
          & (Join-Path $packageRoot "evolab-launcher\install.ps1") `
            -Prefix $prefix `
            -NoPathUpdate
          & (Join-Path $prefix "bin\evolab.cmd") webui --help

  publish:
    name: Publish immutable GitHub pre-release
    needs: [build, macos-install-smoke, wsl-install-smoke, windows-install-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: evolab-${{ github.ref_name }}-launcher

      - name: Publish EvoLab pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace immutable assets." >&2
            exit 1
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body > "$RUNNER_TEMP/generated-notes.md"
          python scripts/release/render_release_notes.py \
            --template docs/user/launcher-release-template.md \
            --version "${GITHUB_REF_NAME#v}" \
            --changelog "$RUNNER_TEMP/generated-notes.md" \
            --output "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" \
            evolab-launcher.zip \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "EvoLab ${GITHUB_REF_NAME#v} (pre-release)" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
