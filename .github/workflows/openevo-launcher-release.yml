name: EvoLab installable pre-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: evolab-launcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build repository-free installers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Require an exact version tag
        shell: bash
        run: |
          set -euo pipefail
          product_version=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )
          expected_tag="v${product_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $expected_tag" >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "$GITHUB_REF_NAME")" != "$(git rev-parse HEAD)" ]]; then
            echo "The checked out commit is not the commit named by $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Verify committed WebUI matches its source
        working-directory: desktop
        run: |
          npm ci
          npm test -- --run
          npm run typecheck
          npm run build:webui-gateway
          git diff --exit-code -- ../src/openevo/web_gateway/static

      - name: Run release packaging tests
        run: |
          python -m pip install pytest
          python -m pytest \
            tests/release/test_release_bundle.py \
            tests/release/test_launcher_distribution.py \
            tests/release/test_online_installer.py \
            -q

      - name: Build Linux, macOS, WSL, and Windows archives
        run: |
          mkdir -p dist
          python scripts/release/build_launcher_distribution.py \
            --commit HEAD \
            --output dist/evolab-launcher.tar.gz
          python scripts/release/build_launcher_distribution.py \
            --commit HEAD \
            --output dist/evolab-launcher.zip
          cd dist
          sha256sum evolab-launcher.tar.gz > evolab-launcher.tar.gz.sha256
          sha256sum evolab-launcher.zip > evolab-launcher.zip.sha256
          sha256sum --check evolab-launcher.tar.gz.sha256
          sha256sum --check evolab-launcher.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: evolab-${{ github.ref_name }}-installers
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/evolab-launcher.tar.gz
            dist/evolab-launcher.tar.gz.sha256
            dist/evolab-launcher.zip
            dist/evolab-launcher.zip.sha256
            install.sh
            install.ps1

  windows-install-smoke:
    name: Install and launch help on Windows
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: evolab-${{ github.ref_name }}-installers

      - name: Verify and install the Windows archive
        shell: powershell
        run: |
          $expected = ((Get-Content dist/evolab-launcher.zip.sha256 -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash dist/evolab-launcher.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Windows archive checksum mismatch" }
          Expand-Archive dist/evolab-launcher.zip -DestinationPath "$env:RUNNER_TEMP\evolab-package"
          $prefix = "$env:RUNNER_TEMP\evolab-installed"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File "$env:RUNNER_TEMP\evolab-package\evolab-launcher\install.ps1" `
            -Prefix $prefix -NoPathUpdate
          if ($LASTEXITCODE -ne 0) { throw "EvoLab installer failed" }
          & "$prefix\bin\evolab.cmd" webui --help
          if ($LASTEXITCODE -ne 0) { throw "Installed EvoLab command failed" }

  publish:
    name: Publish immutable GitHub pre-release
    needs: [build, windows-install-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: evolab-${{ github.ref_name }}-installers

      - name: Publish EvoLab pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace immutable assets." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/evolab-launcher.tar.gz \
            dist/evolab-launcher.tar.gz.sha256 \
            dist/evolab-launcher.zip \
            dist/evolab-launcher.zip.sha256 \
            install.sh \
            install.ps1 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "EvoLab ${GITHUB_REF_NAME#v} (pre-release)" \
            --generate-notes
