name: OpenEvo launcher release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: openevo-launcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish repository-free launcher
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Require an exact version tag
        shell: bash
        run: |
          set -euo pipefail
          product_version=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )
          expected_tag="v${product_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $expected_tag" >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "$GITHUB_REF_NAME")" != "$(git rev-parse HEAD)" ]]; then
            echo "The checked out commit is not the commit named by $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "OPENEVO_PRODUCT_VERSION=$product_version" >> "$GITHUB_ENV"

      - name: Verify committed WebUI matches its source
        working-directory: desktop
        run: |
          npm ci
          npm test -- --run
          npm run typecheck
          npm run build:webui-gateway
          git diff --exit-code -- ../src/openevo/web_gateway/static

      - name: Run release packaging tests
        run: |
          python -m pip install pytest
          python -m pytest \
            tests/release/test_release_bundle.py \
            tests/release/test_launcher_distribution.py \
            tests/release/test_online_installer.py \
            -q

      - name: Build launcher archive and checksum
        run: |
          mkdir -p dist
          python scripts/release/build_launcher_distribution.py \
            --commit HEAD \
            --output dist/openevo-launcher.tar.gz
          cd dist
          sha256sum openevo-launcher.tar.gz > openevo-launcher.tar.gz.sha256
          sha256sum --check openevo-launcher.tar.gz.sha256

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace immutable assets." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/openevo-launcher.tar.gz \
            dist/openevo-launcher.tar.gz.sha256 \
            install.sh \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "OpenEvo ${OPENEVO_PRODUCT_VERSION}" \
            --generate-notes
